<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Vendor - DaVinci</title>
    <script>try{if(localStorage.getItem('davinci:dark-mode')==='1')document.documentElement.classList.add('dark-mode');}catch(e){}</script>
    <!-- The framework will automatically load all CSS from assets -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../shared-borders.css?v=4">
    <link rel="stylesheet" href="../shared-accent.css?v=4">
    <link rel="stylesheet" href="../shared-chrome.css?v=79">
    <link rel="stylesheet" href="../ai-assistant.css?v=9">
    <link rel="stylesheet" href="../shared-font.css">
    <link rel="stylesheet" href="../dark-mode-pages.css?v=2">
    <script src="../lucide-icons.js?v=6"></script>
    <script src="../sentence-case.js?v=3"></script>
    <script src="../button-motion.js?v=40"></script>
    <script src="../navbar-tools.js?v=22"></script>
    <script src="../presence.js?v=13"></script>
    <script src="../tab-loading.js?v=30"></script>
    <script src="../active-nav.js"></script>
</head>
<body>
    <!-- App container where the canvas will be injected -->
    <div id="app"></div>

    <!-- Define your page-specific content here -->
    <script id="page-content" type="text/html">
        <!-- NOTE: Subheader is handled by canvas automatically via canvas-navigation-data.json -->
        <!-- Do NOT add subheader HTML here - it will create duplicates -->
        
        <div class="equipment-vendor-page">
            <!-- Vendor Card -->
            <div class="vendor-card-container">
                <div class="card vendor-card">
                    <div class="card__header">
                        <div class="vendor-card__header-content">
                            <div class="form-group vendor-name-group">
                                <input type="text" id="vendor-name" class="form-input vendor-name-input" value="ACME Corporation" placeholder="Vendor Name">
                            </div>
                            <label class="switch switch--small">
                                <input type="checkbox" class="switch__input vendor-enable-toggle" checked>
                                <span class="switch__slider"></span>
                                <span class="switch__label">Enabled</span>
                            </label>
                        </div>
                    </div>
                    <div class="card__body">
                        <div class="vendor-compact-grid">
                            <!-- Grid items - 2 columns layout with floating labels -->
                            <div class="form-group form-group--medium compact-field">
                                <label class="form-label" for="vendor-dri">Vendor DRI</label>
                                <input type="text" id="vendor-dri" class="form-input" value="John Smith" placeholder="Enter Vendor DRI">
                            </div>
                            <div class="form-group form-group--medium compact-field">
                                <label class="form-label" for="eng-intent">ENG Intent</label>
                                <input type="text" id="eng-intent" class="form-input" value="Sarah Johnson" placeholder="Enter ENG Intent">
                            </div>
                            
                            <div class="form-group form-group--medium compact-field">
                                <label class="form-label" for="mp-intent">MP Intent</label>
                                <input type="text" id="mp-intent" class="form-input" value="Manufacturing" placeholder="Enter MP Intent">
                            </div>
                            <div class="form-group form-group--medium compact-field">
                                <label class="form-label" for="design-manager">Design Manager</label>
                                <input type="text" id="design-manager" class="form-input" value="Mike Chen" placeholder="Enter Design Manager">
                            </div>
                            
                            <div class="form-group form-group--medium compact-field">
                                <label class="form-label" for="line-side">Assembly area</label>
                                <input type="text" id="line-side" class="form-input" value="Production A" placeholder="Enter Assembly area">
                            </div>
                            <div class="form-group form-group--medium compact-field">
                                <label class="form-label" for="aqid">AQID</label>
                                <input type="text" id="aqid" class="form-input" value="AQ-2024-001" placeholder="Enter AQID">
                            </div>
                            
                            <div class="form-group form-group--medium compact-field">
                                <label class="form-label" for="vendor-pn">VPN</label>
                                <input type="text" id="vendor-pn" class="form-input" value="789456" placeholder="Enter VPN">
                            </div>
                            <div class="form-group form-group--medium compact-field">
                                <label class="form-label" for="cm-pn">CM PN</label>
                                <input type="text" id="cm-pn" class="form-input" value="123789" placeholder="Enter CM PN">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <!-- Load the DaVinci Canvas Framework -->
    <script src="../../.davinci/assets/canvas/davinci-canvas.js"></script>
    
    <!-- Page-specific JavaScript -->
    <script src="js/main.js"></script>
    <script src="../ai-assistant.js?v=13"></script>
</body>
</html>
