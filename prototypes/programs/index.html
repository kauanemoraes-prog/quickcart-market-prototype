<body>
    <!-- App container where the canvas will be injected -->
    <div id="app"></div>

    <!-- Define your page-specific content here -->
    <script id="page-content" type="text/html">
        <div class="programs-page">
            <div class="programs-header">
                <div class="programs-header__line">
                    <h1>Stores</h1>
                    <div class="programs-header__items" id="programs-header-items"></div>
                </div>
                <div class="add-program-hover">
                    <button type="button" class="btn btn--primary btn--medium add-program-hover__trigger" aria-haspopup="menu">
                        <lucide-icon name="plus" style="font-size:16px"></lucide-icon>
                        <span>Add Store</span>
                    </button>
                    <div class="add-program-hover__menu">
                        <button type="button" class="add-program-hover__item" data-add-program-action="scratch">From scratch</button>
                        <button type="button" class="add-program-hover__item" data-add-program-action="existing">From existing</button>
                    </div>
                </div>
            </div>
            
            <!-- Search and filter toolbar -->
            <div class="programs-toolbar">
                <div class="programs-search-group">
                    <div class="programs-search">
                        <lucide-icon name="search" class="programs-search__icon" style="font-size:16px"></lucide-icon>
                        <input type="text" class="programs-search__input" placeholder="Filter by city, state, region, store, neighborhood or manager" id="programs-search">
                        <span class="programs-search__shortcut">⌘K</span>
                    </div>
                    
                    <div class="form-group programs-state-filter">
                        <select id="programs-region-filter" class="form-select form-select--stylized" aria-label="Filter by region">
                            <option value="">All regions</option>
                        </select>
                    </div>

                    <div class="form-group programs-state-filter">
                        <select id="programs-state-filter" class="form-select form-select--stylized" aria-label="Filter by state">
                            <option value="">All states</option>
                        </select>
                    </div>

                    <label class="switch programs-favorites-switch">
                        <input type="checkbox" class="switch__input" id="favorites-only">
                        <span class="switch__slider"></span>
                        <span class="switch__label">Favorites only</span>
                    </label>
                </div>
                
                <div class="programs-toolbar__actions">
                <div class="view-toggle" role="group" aria-label="Switch view">
                    <button type="button" class="view-toggle__btn view-toggle__btn--active" data-view="list" aria-pressed="true" aria-label="List view" title="List view">
                        <lucide-icon name="list" style="font-size:18px"></lucide-icon>
                    </button>
                    <button type="button" class="view-toggle__btn" data-view="card" aria-pressed="false" aria-label="Card view" title="Card view">
                        <lucide-icon name="layout-grid" style="font-size:18px"></lucide-icon>
                    </button>
                </div>
                <div class="form-group programs-group-by">
                    <select id="programs-group-by" class="form-select form-select--stylized" aria-label="Group by">
                        <option value="exhibition" selected>View by city</option>
                        <option value="museum">View by store</option>
                    </select>
                </div>
                </div>
            </div>
            
            <!-- Add Program Drawer -->
            <div class="drawer-overlay" id="add-program-drawer">
                <div class="drawer drawer--right">
                    <div class="drawer__header">
                        <button class="drawer__close" id="close-drawer-btn">×</button>
                        <h3 class="drawer__title">Add New Exhibition</h3>
                    </div>
                    <div class="drawer__body">
                        <!-- Program details section -->
                        <div class="drawer-section">
                            <h4 class="drawer-section__title">Exhibition details</h4>
                            
                            <div class="drawer-form-row">
                                <div class="form-group">
                                    <label class="form-label" for="program-code">Exhibition Code</label>
                                    <div class="form-input-with-icon">
                                        <input type="text" id="program-code" class="form-input" placeholder="Search for Exhibition Code">
                                        <lucide-icon name="search" class="form-input-icon" style="font-size:16px"></lucide-icon>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="program-name">Exhibition Name (Optional)</label>
                                    <input type="text" id="program-name" class="form-input" placeholder="Type Exhibition Name">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="program-admin">Exhibition Admin</label>
                                    <input type="text" id="program-admin" class="form-input" value="Johnny Doe">
                                </div>
                            </div>
                            
                            <div class="drawer-form-row">
                                <div class="form-group">
                                    <label class="form-label" for="line-of-business">Line of Business</label>
                                    <select id="line-of-business" class="form-select">
                                        <option value="">Select Line of Business</option>
                                        <option value="lob1">Line of Business 1</option>
                                        <option value="lob2">Line of Business 2</option>
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="product-line">Collection</label>
                                    <select id="product-line" class="form-select">
                                        <option value="">Select Collection</option>
                                        <option value="pl1">Collection 1</option>
                                        <option value="pl2">Collection 2</option>
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label" for="program-architecture">Exhibition Architecture</label>
                                    <select id="program-architecture" class="form-select">
                                        <option value="">Select Exhibition Architecture</option>
                                        <option value="arch1">Architecture 1</option>
                                        <option value="arch2">Architecture 2</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Tabs section -->
                        <div class="drawer-tabs">
                            <div class="tabs__nav">
                                <button class="tabs__tab tabs__tab--active" data-drawer-tab="sites">Sites</button>
                                <button class="tabs__tab" data-drawer-tab="program-users">Exhibition Users</button>
                                <button class="tabs__tab" data-drawer-tab="pcn-settings">PCR Settings</button>
                            </div>
                        </div>
                        
                        <!-- Sites tab content -->
                        <div class="drawer-tab-content drawer-tab-content--active" id="drawer-sites">
                            <div class="drawer-table-header">
                                <span>Site</span>
                                <span>Exhibition Alias <lucide-icon name="info" style="font-size:12px"></lucide-icon></span>
                                <span>Preparation Schedule (Optional)</span>
                                <span>Site Users</span>
                            </div>
                            
                            <button class="add-site-btn">
                                <lucide-icon name="circle-plus" style="font-size:16px"></lucide-icon>
                                Add new site
                            </button>
                        </div>
                        
                        <!-- Program Users tab content -->
                        <div class="drawer-tab-content" id="drawer-program-users">
                            <p style="color: var(--color-glyph-gray-secondary); font-size: var(--font-size-xxs);">Exhibition Users content</p>
                        </div>
                        
                        <!-- PCN Settings tab content -->
                        <div class="drawer-tab-content" id="drawer-pcn-settings">
                            <p style="color: var(--color-glyph-gray-secondary); font-size: var(--font-size-xxs);">PCR Settings content</p>
                        </div>
                    </div>
                    <div class="drawer__footer">
                        <button class="btn btn--secondary btn--medium" id="cancel-drawer-btn">Cancel</button>
                        <button class="btn btn--primary btn--medium">Add Exhibition</button>
                    </div>
                </div>
            </div>

            <!-- Program (Index) Drawer — copied from Index tab, opens on "Add Program → From scratch" -->
            <div class="drawer-overlay" id="program-drawer">
                <div class="drawer drawer--right drawer--large program-drawer">
                    <div class="drawer__header">
                        <button class="drawer__close" id="program-drawer-close" aria-label="Close drawer">
                            <lucide-icon name="x" style="font-size:24px"></lucide-icon>
                        </button>
                        <h3 class="drawer__title">Add Exhibition from scratch</h3>
                    </div>

                    <div class="drawer__body">
                        <div class="drawer-section">
                            <p class="drawer-section__label">Exhibition details</p>
                            <div class="drawer-form-row">
                                <div class="form-group form-group--medium form-input-with-icon">
                                    <label class="form-label" for="pgm-code">Exhibition Code</label>
                                    <input type="text" id="pgm-code" class="form-input" value="D54" placeholder="Search for Exhibition Code">
                                    <lucide-icon name="search" class="form-input-icon" style="font-size:16px"></lucide-icon>
                                </div>
                                <div class="form-group form-group--medium">
                                    <label class="form-label" for="pgm-name">Exhibition Name (Optional)</label>
                                    <input type="text" id="pgm-name" class="form-input" placeholder="Type Exhibition Name">
                                </div>
                                <div class="form-group form-group--medium">
                                    <label class="form-label" for="pgm-admin">Exhibition Admin</label>
                                    <input type="text" id="pgm-admin" class="form-input" value="Kauane de Moraes Rodrigues da Cruz">
                                </div>
                            </div>
                            <div class="drawer-form-row">
                                <div class="form-group form-group--medium">
                                    <label class="form-label" for="pgm-lob">Line of Business</label>
                                    <input type="text" id="pgm-lob" class="form-input" value="LOB-004" readonly>
                                </div>
                                <div class="form-group form-group--medium">
                                    <label class="form-label" for="pgm-pl">Collection</label>
                                    <input type="text" id="pgm-pl" class="form-input" value="LOB-04 - Studio Pen" readonly>
                                </div>
                                <div class="form-group form-group--medium">
                                    <label class="form-label" for="pgm-arch">Exhibition Architecture</label>
                                    <input type="text" id="pgm-arch" class="form-input" value="v1.0" readonly>
                                </div>
                            </div>
                        </div>

                        <div class="drawer-tabs-row">
                            <div class="drawer-tabs">
                                <button class="drawer-tab drawer-tab--active" data-drawer-tab="sites">Sites</button>
                                <button class="drawer-tab" data-drawer-tab="users">Exhibition Users</button>
                                <button class="drawer-tab" data-drawer-tab="pcn">PCR Settings</button>
                            </div>
                            <label class="drawer-color-toggle">
                                <input type="checkbox" id="color-code-dept" checked>
                                <span class="drawer-color-toggle__slider"></span>
                                <span class="drawer-color-toggle__label">Color-code Departments</span>
                            </label>
                        </div>

                        <div class="drawer-tab-content drawer-tab-content--active" id="drawer-sites">
                            <p class="drawer-sites-note"><strong>Note:</strong> The Index <strong>copies selected</strong> Workstations, Tools, Materials and more information from an existing exhibition and can be performed only <strong>once</strong> per site.</p>
                            <div class="sites-table">
                                <div class="sites-table__head">
                                    <div class="sites-table__cell sites-table__cell--site">
                                        Site
                                        <button class="sites-table__add" aria-label="Add new site">
                                            <lucide-icon name="plus.circle"></lucide-icon>
                                        </button>
                                    </div>
                                    <div class="sites-table__cell sites-table__cell--alias">
                                        Exhibition Alias
                                        <lucide-icon name="info.circle" class="sites-table__info"></lucide-icon>
                                    </div>
                                    <div class="sites-table__cell sites-table__cell--build">
                                        Preparation Schedule (Optional)
                                    </div>
                                    <div class="sites-table__cell sites-table__cell--users">
                                        Site Users
                                    </div>
                                </div>
                                <div id="drawer-sites-body"></div>
                            </div>
                        </div>

                        <div class="drawer-tab-content" id="drawer-users">
                            <div class="users-toolbar">
                                <div class="form-group users-toolbar__filter">
                                    <input type="text" class="form-input" placeholder="Filter by name or ID">
                                    <lucide-icon name="magnifyingglass" class="users-toolbar__icon"></lucide-icon>
                                </div>
                                <select class="form-select">
                                    <option>All accesses</option>
                                </select>
                                <select class="form-select">
                                    <option>All departments</option>
                                </select>
                            </div>
                            <div class="users-table">
                                <div class="users-table__head">
                                    <div class="users-table__cell users-table__cell--name">
                                        Name
                                        <button class="users-table__add" aria-label="Add user">
                                            <lucide-icon name="plus.circle"></lucide-icon>
                                        </button>
                                    </div>
                                    <div class="users-table__cell">ID</div>
                                    <div class="users-table__cell">Company</div>
                                    <div class="users-table__cell">Access</div>
                                    <div class="users-table__cell">User Department</div>
                                    <div class="users-table__cell users-table__cell--remove"></div>
                                </div>
                                <div id="drawer-users-body"></div>
                            </div>
                        </div>

                        <div class="drawer-tab-content" id="drawer-pcn">
                            <div class="pcn-layout">
                                <aside class="pcn-sidebar">
                                    <button class="pcn-sidebar__item pcn-sidebar__item--active">Exhibition Level</button>
                                    <button class="pcn-sidebar__item">
                                        <span>ABCE</span>
                                    </button>
                                    <button class="pcn-sidebar__item">
                                        <span>ABCD</span>
                                        <lucide-icon name="lock.fill" class="pcn-sidebar__lock"></lucide-icon>
                                    </button>
                                </aside>
                                <div class="pcn-main">
                                    <div class="pcn-main__head">
                                        <span class="pcn-main__title">Sites</span>
                                        <div class="pcn-main__locks">
                                            <label class="pcn-toggle">
                                                <input type="checkbox" class="pcn-toggle__input">
                                                <span class="pcn-toggle__slider"></span>
                                                <lucide-icon name="lock.fill" class="pcn-toggle__icon"></lucide-icon>
                                                <span class="pcn-toggle__label">CM Lock</span>
                                                <lucide-icon name="info.circle" class="pcn-toggle__info"></lucide-icon>
                                            </label>
                                            <label class="pcn-toggle">
                                                <input type="checkbox" class="pcn-toggle__input">
                                                <span class="pcn-toggle__slider"></span>
                                                <lucide-icon name="lock.fill" class="pcn-toggle__icon"></lucide-icon>
                                                <span class="pcn-toggle__label">General Lock</span>
                                                <lucide-icon name="info.circle" class="pcn-toggle__info"></lucide-icon>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="pcn-main__body">
                                        <div class="pcn-row">ABCE</div>
                                        <div class="pcn-row">ABCD</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="drawer__footer program-drawer__footer">
                        <button class="btn btn--secondary btn--medium" id="program-drawer-close-btn">Cancel</button>
                        <button class="btn btn--primary btn--medium" id="program-drawer-add-btn">Add Exhibition</button>
                    </div>
                    </div>
                </div>
            </div>

            <!-- Perform Index confirm modal — opens on "Add Program" click inside the From-scratch drawer -->
            <div class="modal-overlay" id="perform-index-modal">
                <div class="modal modal--medium perform-index-modal">
                    <div class="modal__header perform-index-modal__header">
                        <h3 class="modal__title">Perform the Index?</h3>
                    </div>
                    <div class="modal__body perform-index-modal__body">
                        <p class="perform-index-modal__text">The Index copies <strong>selected</strong> Workstations, Tools, Materials and more information from an existing exhibition and can be performed only <strong>once</strong> per site.</p>
                        <div class="perform-index-modal__options">
                            <label class="radio">
                                <input type="radio" name="perform-index-choice" value="add" class="radio__input" checked>
                                <span class="radio__circle"></span>
                                <span class="radio__label">Add Exhibition Only</span>
                            </label>
                            <label class="radio">
                                <input type="radio" name="perform-index-choice" value="index" class="radio__input">
                                <span class="radio__circle"></span>
                                <span class="radio__label">Index</span>
                            </label>
                            <div class="perform-index-modal__site-picker" id="perform-index-site-picker" hidden>
                                <div class="form-group form-group--medium">
                                    <select class="form-select form-select--stylized" id="perform-index-site-select">
                                        <option value="ABCE" selected>ABCE</option>
                                        <option value="DEFG">DEFG</option>
                                        <option value="HIJK">HIJK</option>
                                    </select>
                                    <label class="form-label" for="perform-index-site-select">Select Site to Index</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal__footer perform-index-modal__footer">
                        <button class="btn btn--primary btn--medium" id="perform-index-proceed-btn">Proceed</button>
                    </div>
                </div>
            </div>

            <!-- Build Schedule Drawer (drawer-on-drawer) -->
            <div class="drawer-overlay" id="build-schedule-drawer">
                <div class="drawer drawer--right drawer--large build-schedule-drawer">
                    <div class="drawer__header build-schedule-drawer__header">
                        <button class="drawer__close" id="build-schedule-close" aria-label="Close preparation schedule">
                            <lucide-icon name="x" style="font-size:24px"></lucide-icon>
                        </button>
                        <h3 class="drawer__title" id="build-schedule-title">Preparation schedule for ABCE</h3>
                        <div class="build-schedule-drawer__actions">
                            <lucide-icon name="info.circle" class="build-schedule-drawer__info" data-proj-tooltip="The Index copies selected Stations, Equipment, Consumables and more information from an existing program. The first Build Event must be empty to perform the Index." data-proj-tooltip-placement="left"></lucide-icon>
                            <button class="btn btn--primary btn--medium build-schedule-drawer__index" id="build-schedule-index-btn">Index</button>
                        </div>
                    </div>
                    <div class="drawer__body">
                        <div class="bs-table">
                            <div class="bs-table__head">
                                <div class="bs-table__cell bs-table__cell--handle"></div>
                                <div class="bs-table__cell bs-table__cell--name">Phase Name</div>
                                <div class="bs-table__cell bs-table__cell--status"></div>
                                <div class="bs-table__cell">Start Date</div>
                                <div class="bs-table__cell">End Date</div>
                                <div class="bs-table__cell">REIHD <lucide-icon name="info.circle" class="bs-table__info"></lucide-icon></div>
                                <div class="bs-table__cell">CIH <lucide-icon name="info.circle" class="bs-table__info"></lucide-icon></div>
                                <div class="bs-table__cell">UPH Target</div>
                                <div class="bs-table__cell">Assembly Plan Status</div>
                                <div class="bs-table__cell bs-table__cell--gear"></div>
                            </div>
                            <div id="build-schedule-body"></div>
                            <button class="bs-table__add">
                                <lucide-icon name="plus.circle"></lucide-icon>
                                Add new project phase
                            </button>
                        </div>
                    </div>
                    <div class="drawer__footer">
                        <button class="btn btn--secondary btn--medium" id="build-schedule-close-btn">Close</button>
                    </div>
                </div>
            </div>
            
            <!-- Add Program from existing — Wizard Modal -->
            <div class="modal-overlay wizard-modal-overlay" id="wizard-modal">
                <div class="modal modal--large wizard-modal">
                    <div class="modal__header wizard-modal__header">
                        <button class="wizard-modal__minimize" id="wizard-minimize-btn" type="button" aria-label="Minimize">
                            <lucide-icon name="minus" style="font-size:18px"></lucide-icon>
                        </button>
                        <h3 class="modal__title" data-wizard-title>Add Exhibition from existing</h3>
                        <button class="modal__close" id="wizard-close-btn" type="button" aria-label="Close">
                            <lucide-icon name="x" style="font-size:20px"></lucide-icon>
                        </button>
                    </div>
                    <div class="modal__body wizard-modal__body">
                        <!-- Step indicator -->
                        <ol class="wizard-steps">
                            <li class="wizard-step wizard-step--active" data-step="1">
                                <span class="wizard-step__badge">1</span>
                                <span class="wizard-step__label">New Exhibition</span>
                            </li>
                            <li class="wizard-step" data-step="2">
                                <span class="wizard-step__badge">2</span>
                                <span class="wizard-step__label">Source</span>
                            </li>
                            <li class="wizard-step" data-step="3">
                                <span class="wizard-step__badge">3</span>
                                <span class="wizard-step__label">Assembly areas + Workstations</span>
                            </li>
                            <li class="wizard-step" data-step="4">
                                <span class="wizard-step__badge">4</span>
                                <span class="wizard-step__label">Tools</span>
                            </li>
                            <li class="wizard-step" data-step="5">
                                <span class="wizard-step__badge">5</span>
                                <span class="wizard-step__label">Material</span>
                            </li>
                            <li class="wizard-step" data-step="6">
                                <span class="wizard-step__badge">6</span>
                                <span class="wizard-step__label">Review</span>
                            </li>
                            <li class="wizard-step" data-step="7">
                                <span class="wizard-step__badge">7</span>
                                <span class="wizard-step__label">Add</span>
                            </li>
                        </ol>

                        <!-- Step 1 content -->
                        <div class="wizard-step-panel wizard-step-panel--active" data-step-panel="1">
                            <div class="wizard-intro">
                                <p>Add exhibition from existing allows to copy selected workstations, tools, and materials from an existing exhibition to a new one.</p>
                                <p><strong>Note:</strong> All relevant relationships will be created automatically.</p>
                                <p><strong>To start:</strong> Enter the information for the <strong>NEW</strong> exhibition.</p>
                            </div>

                            <h4 class="wizard-section-title">New Exhibition details</h4>
                            <div class="wizard-form-grid">
                                <div class="form-group form-group--medium">
                                    <label class="form-label" for="wizard-program-code">Exhibition Code</label>
                                    <input type="text" id="wizard-program-code" class="form-input" value="D52" placeholder=" ">
                                </div>
                                <div class="form-group form-group--medium">
                                    <label class="form-label" for="wizard-program-name">Exhibition Name (Optional)</label>
                                    <input type="text" id="wizard-program-name" class="form-input" placeholder="Type Exhibition Name">
                                </div>
                                <div class="form-group form-group--medium">
                                    <label class="form-label" for="wizard-program-admin">Exhibition Admin</label>
                                    <input type="text" id="wizard-program-admin" class="form-input" value="Isaac Newton" placeholder=" ">

            <td class="table__cell table__cell--center">
                <button class="action-btn" data-id="{{code}}" aria-label="Actions">
                    <lucide-icon name="ellipsis-vertical" style="font-size:20px"></lucide-icon>
                </button>
            </td>
        </tr>
        <tr class="table__row table__row--expanded" data-parent-id="{{code}}" style="display: none;">
            <td colspan="10" class="table__cell--expanded">
                <table class="table table--nested">
                    <colgroup>
                        <col class="nested-col nested-col--1"><col class="nested-col nested-col--2"><col class="nested-col nested-col--3"><col class="nested-col nested-col--4"><col class="nested-col nested-col--5"><col class="nested-col nested-col--6"><col class="nested-col nested-col--7"><col class="nested-col nested-col--8"><col class="nested-col nested-col--9"><col class="nested-col nested-col--10">
                    </colgroup>
                    <thead class="table__head">
                        <tr class="table__row">
                            <th class="table__header table__header--nested-spacer"></th>
                            <th class="table__header table__header--nested">Store</th>
                            <th class="table__header table__header--nested" colspan="2">Address</th>
                            <th class="table__header table__header--nested">Store Manager</th>
                            <th class="table__header table__header--nested">Low stock</th>
                            <th class="table__header table__header--nested">Overdue tasks</th>
                            <th class="table__header table__header--nested">Last Updated</th>
                            <th class="table__header table__header--nested">Status</th>
                            <th class="table__header table__header--nested"></th>
                        </tr>
                    </thead>
                    <tbody class="table__body">
                        {{#each sites}}
                        <tr class="table__row">
                            <td class="table__cell table__cell--nested-spacer"></td>
                            <td class="table__cell table__cell--nested"><a href="program-detail.html?code={{../code}}&site={{site}}" class="program-code-link">{{storeName}}</a> <span class="store-code">{{storeCode}}</span></td>
                            <td class="table__cell table__cell--nested" colspan="2">{{address}}</td>
                            <td class="table__cell table__cell--nested"><button type="button" class="person-link" data-person="{{lead}}" data-role="Store Manager" aria-haspopup="dialog" aria-expanded="false">{{lead}}</button></td>
                            <td class="table__cell table__cell--nested"><span class="metric-count{{#if lowStock}} metric-count--warn{{/if}}">{{lowStock}}</span></td>
                            <td class="table__cell table__cell--nested"><span class="metric-count{{#if overdueTasks}} metric-count--bad{{/if}}">{{overdueTasks}}</span></td>
                            <td class="table__cell table__cell--nested">{{lastUpdate}}</td>
                            <td class="table__cell table__cell--nested"><span class="status-badge" data-status="{{status}}">{{statusLabel}}</span></td>
                            <td class="table__cell table__cell--nested"></td>
                        </tr>
                        {{/each}}
                    </tbody>
                </table>
            </td>
        </tr>
        {{/each}}
    </script>

    <!-- Handlebars templates for the Index-style drawer (sites / users / build-schedule rows) -->
    <script id="sites-row-template" type="text/x-handlebars-template">
        {{#each sites}}
        <div class="sites-table__row{{#if indexed}} sites-table__row--indexed{{/if}}" data-site-id="{{id}}">
            <div class="sites-table__cell sites-table__cell--site">
                <div class="site-autocomplete">
                    <input type="text" class="site-autocomplete__input" data-site-input value="{{code}}" placeholder="Search sites..." autocomplete="off">
                    <ul class="site-autocomplete__menu" data-site-menu hidden></ul>
                </div>
            </div>
            <div class="sites-table__cell sites-table__cell--alias">
                <input type="text" class="site-alias-input" data-site-alias value="{{alias}}" placeholder="Add alias">
            </div>
            <div class="sites-table__cell sites-table__cell--build">
                {{#if buildEvents.length}}
                <span class="build-flow">
                    {{#each buildEvents}}<span class="build-flow__event{{#if locked}} build-flow__event--locked{{/if}}">{{name}}</span>{{#unless @last}}<lucide-icon name="arrow.right" class="build-flow__arrow"></lucide-icon>{{/unless}}{{/each}}
                </span>
                <button class="edit-link" data-edit-build-schedule="{{code}}">
                    <lucide-icon name="pencil" class="edit-link__icon"></lucide-icon>
                    {{#if indexed}}Indexed{{else}}Edit{{/if}}
                </button>
                {{else}}
                <button class="edit-link edit-link--add" data-edit-build-schedule="{{code}}">
                    <lucide-icon name="plus.circle" class="edit-link__icon"></lucide-icon>
                    Add Preparation Schedule
                </button>
                {{/if}}
                <span class="build-cell__divider" aria-hidden="true"></span>
                <button class="edit-link edit-link--index{{#if indexed}} edit-link--disabled{{/if}}" data-index-site="{{code}}"{{#if indexed}} disabled{{/if}}>
                    <lucide-icon name="arrow.triangle.2.circlepath" class="edit-link__icon"></lucide-icon>
                    Index
                </button>
            </div>
            <div class="sites-table__cell sites-table__cell--users">
                <span class="site-users__count">{{userCount}}</span>
                <button class="edit-link">
                    <lucide-icon name="pencil" class="edit-link__icon"></lucide-icon> Edit
                </button>
            </div>
        </div>
        {{/each}}
    </script>

    <script id="users-row-template" type="text/x-handlebars-template">
        {{#each users}}
        <div class="users-table__row">
            <div class="users-table__cell users-table__cell--name"><a href="#" class="user-link">{{name}}</a></div>
            <div class="users-table__cell">{{userId}}</div>
            <div class="users-table__cell">{{company}}</div>
            <div class="users-table__cell users-table__cell--access">
                {{access}}
                {{#if accessInfo}}<lucide-icon name="info.circle" class="users-table__info"></lucide-icon>{{/if}}
            </div>
            <div class="users-table__cell users-table__cell--dept"><span class="users-dept-select">{{userDept}}</span></div>
            <div class="users-table__cell users-table__cell--remove">
                {{#if removable}}<button class="users-remove-btn" aria-label="Remove user"><lucide-icon name="minus.circle.fill"></lucide-icon></button>{{else}}<lucide-icon name="info.circle" class="users-table__info"></lucide-icon>{{/if}}
            </div>
        </div>
        {{/each}}
    </script>

    <script id="bs-row-template" type="text/x-handlebars-template">
        {{#each events}}
        <div class="bs-table__row{{#if locked}} bs-table__row--locked{{/if}}">
            <div class="bs-table__cell bs-table__cell--handle">
                {{#if locked}}<lucide-icon name="lock.fill"></lucide-icon>{{else}}<lucide-icon name="line.3.horizontal" class="bs-table__handle"></lucide-icon>{{/if}}
            </div>
            <div class="bs-table__cell bs-table__cell--name">
                <input type="text" class="form-input form-input--table-cell bs-input" value="{{name}}" {{#if locked}}readonly placeholder="{{name}}"{{/if}}>
            </div>
            <div class="bs-table__cell bs-table__cell--status">
                {{#if active}}<span class="bs-status-tag">Active</span>{{/if}}
            </div>
            <div class="bs-table__cell"><input type="date" class="form-input form-input--table-cell bs-input bs-input--date" placeholder="TBD"></div>
            <div class="bs-table__cell"><input type="date" class="form-input form-input--table-cell bs-input bs-input--date" placeholder="TBD"></div>
            <div class="bs-table__cell"><input type="date" class="form-input form-input--table-cell bs-input bs-input--date" placeholder="TBD"></div>
            <div class="bs-table__cell"><input type="date" class="form-input form-input--table-cell bs-input bs-input--date" placeholder="TBD"></div>
            <div class="bs-table__cell"><input type="date" class="form-input form-input--table-cell bs-input bs-input--date" placeholder="TBD"></div>
            <div class="bs-table__cell bs-table__cell--pf">
                <span class="bs-pf-tag bs-pf-tag--{{lowercase pfStatus}}">{{pfStatus}}</span>
            </div>
            <div class="bs-table__cell bs-table__cell--gear">
                {{#if locked}}<lucide-icon name="info.circle" class="bs-table__info"></lucide-icon>{{else}}<lucide-icon name="gearshape" class="bs-table__gear"></lucide-icon>{{/if}}
            </div>
        </div>
        {{/each}}
    </script>

    <!-- Load the DaVinci Canvas Framework -->
    <script src="../../davinci/assets/canvas/davinci-canvas.js"></script>

    <script src="js/data.js?v=35"></script>

    <script src="js/row-expander.js"></script>
    <script src="js/favorites.js?v=18"></script>
    <script src="js/action-buttons.js"></script>
    <script src="js/drawer.js"></script>
    <script src="js/programs-columns.js?v=43"></script>
    <script src="js/programs-view.js?v=60"></script>
    <script src="js/programs-search.js?v=22"></script>
    <script src="js/program-add-menu.js?v=2"></script>
    <script src="js/program-wizard.js"></script>
    <script src="js/pi-data.js"></script>
    <script src="js/pi-drawer.js"></script>
    <script src="js/pi-build-schedule-drawer.js"></script>
    <script src="js/main.js"></script>
    <script src="../ai-assistant.js?v=13"></script>
</body>
</html>
