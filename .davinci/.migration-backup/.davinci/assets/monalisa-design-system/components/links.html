<!-- BASIC LINKS -->
<p style="font-size: var(--font-size-xxs); color: var(--color-glyph-gray);">
  This is a paragraph with a <a href="#">standard link</a> in the middle of the text.
</p>

<p style="font-size: var(--font-size-xxs); color: var(--color-glyph-gray);">
  You can also have <a href="#">multiple links</a> in a single paragraph, like <a href="#">this one</a> and <a href="#">this one</a>.
</p>

<!-- STANDALONE LINKS -->
<a href="#">Default Link</a>
<a href="#" style="font-weight: var(--font-weight-medium);">Medium Weight Link</a>
<a href="#" style="font-weight: var(--font-weight-semibold);">Semibold Link</a>

<!-- LINKS IN A LIST -->
<ul style="font-size: var(--font-size-xxs); color: var(--color-glyph-gray); line-height: var(--line-height-default); padding-left: var(--space-ml);">
  <li><a href="#">Getting Started Guide</a></li>
  <li><a href="#">Component Documentation</a></li>
  <li><a href="#">Design Principles</a></li>
  <li><a href="#">API Reference</a></li>
</ul>

<!-- USAGE:
- Links use primary accent color (#0071E3)
- Hover state adds underline
- Focus state shows outline for keyboard navigation
- Active state uses darker accent color
- Links inherit font size from parent
- Can be used inline in text or standalone
- Font weight can be adjusted with inline styles
-->
