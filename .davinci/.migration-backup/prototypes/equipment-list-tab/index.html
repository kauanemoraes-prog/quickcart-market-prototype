<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment List Tab - DaVinci</title>
    <script>try{if(localStorage.getItem('davinci:dark-mode')==='1')document.documentElement.classList.add('dark-mode');}catch(e){}</script>
    <!-- The framework will automatically load all CSS from assets -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- App container where the canvas will be injected -->
    <div id="app"></div>

    <!-- Define your page-content here -->
    <script id="page-content" type="text/html">
        <div class="equip-page">
            <!-- Program Detail Header -->
            <div class="equip-header">
                <div class="equip-header__nav">
                    <!-- Back button -->
                    <a href="../programs/index.html" class="back-btn" aria-label="Back to programs">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </a>

                    <!-- Program dropdown -->
                    <div class="header-dropdown">
                        <label class="header-dropdown__label">Program</label>
                        <div class="header-dropdown__select-wrapper">
                            <select id="program-select" class="header-dropdown__select">
                                <option value="H10" selected>H10</option>
                                <option value="H09">H09</option>
                                <option value="H08">H08</option>
                            </select>
                            <svg class="header-dropdown__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                    </div>

                    <!-- Site dropdown -->
                    <div class="header-dropdown">
                        <label class="header-dropdown__label">Site</label>
                        <div class="header-dropdown__select-wrapper">
                            <select id="site-select" class="header-dropdown__select">
                                <option value="ABCE" selected>ABCE</option>
                                <option value="KAUANE">KAUANE</option>
                            </select>
                            <svg class="header-dropdown__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                    </div>

                    <!-- Build stages -->
                    <div class="build-stages" id="build-stages"></div>

                    <!-- Version and UPH info -->
                    <div class="header-info">
                        <div class="version-badge">V8 - Draft</div>
                        <div class="uph-target">
                            <span>UPH Target: 0</span>
                            <button class="edit-btn" aria-label="Edit UPH target">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.333 2C11.508 1.825 11.716 1.686 11.945 1.591C12.174 1.497 12.419 1.448 12.666 1.448C12.914 1.448 13.159 1.497 13.388 1.591C13.617 1.686 13.825 1.825 14 2C14.175 2.175 14.314 2.383 14.408 2.612C14.503 2.84 14.552 3.086 14.552 3.333C14.552 3.581 14.503 3.826 14.408 4.055C14.314 4.284 14.175 4.492 14 4.667L5.333 13.333L2 14.333L3 11L11.333 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                        <div class="reihd-info">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="5" r="0.75" fill="currentColor"/></svg>
                            <span>REIHD: TBD</span>
                            <button class="edit-btn" aria-label="Edit REIHD">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.333 2C11.508 1.825 11.716 1.686 11.945 1.591C12.174 1.497 12.419 1.448 12.666 1.448C12.914 1.448 13.159 1.497 13.388 1.591C13.617 1.686 13.825 1.825 14 2C14.175 2.175 14.314 2.383 14.408 2.612C14.503 2.84 14.552 3.086 14.552 3.333C14.552 3.581 14.503 3.826 14.408 4.055C14.314 4.284 14.175 4.492 14 4.667L5.333 13.333L2 14.333L3 11L11.333 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div class="program-tabs">
                <div class="tabs">
                    <div class="tabs__nav">
                        <button class="tabs__tab" data-tab="process-flow">Process Flow</button>
                        <button class="tabs__tab tabs__tab--active" data-tab="equipment-list">Equipment – List <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="margin-left:2px;vertical-align:middle;"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                        <button class="tabs__tab" data-tab="consumables">Consumables</button>
                        <button class="tabs__tab" data-tab="pending-pcns">PCN – Pending <span class="badge-counter" style="position:relative;top:-1px;margin-left:4px;">4</span> <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="margin-left:2px;vertical-align:middle;"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    </div>
                </div>

                <div class="tabs-actions">
                    <button class="btn btn--secondary btn--small">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8V13H13V8M8 10V3M8 3L5 6M8 3L11 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Import
                    </button>
                    <button class="btn btn--secondary btn--small">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3V10M8 10L5 7M8 10L11 7M3 13H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Export
                    </button>
                    <button class="btn btn--primary btn--small">Publish</button>
                    <button class="toolbar-btn toolbar-btn--icon" aria-label="Settings">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 1V3M8 13V15M1 8H3M13 8H15M2.93 2.93L4.34 4.34M11.66 11.66L13.07 13.07M13.07 2.93L11.66 4.34M4.34 11.66L2.93 13.07" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>

            <!-- Equipment List Content -->
            <div class="equip-content">
                <!-- Toolbar -->
                <div class="process-toolbar">
                    <div class="toolbar-left">
                        <div class="search-bar">
                            <svg class="search-bar__icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                            <input type="text" class="search-bar__input" placeholder="Type keywords..." id="equip-search">
                            <span class="search-bar__shortcut">⌘K</span>
                        </div>
                        <button class="toolbar-btn toolbar-btn--icon" aria-label="Info">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 7V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="5" r="0.75" fill="currentColor"/></svg>
                        </button>
                    </div>

                    <div class="toolbar-actions">
                        <button class="tag-btn">Station View</button>
                        <button class="tag-btn">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8C1 8 4 3 8 3C12 3 15 8 15 8C15 8 12 13 8 13C4 13 1 8 1 8Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
                            0/83
                        </button>
                        <button class="toolbar-btn toolbar-btn--icon" aria-label="Filter columns">
                            <img src="../../.davinci/assets/icons/regular/slider-horizontal-3.svg" alt="" width="16" height="16">
                        </button>
                        <button class="toolbar-btn toolbar-btn--icon" aria-label="Column settings">
                            <img src="../../.davinci/assets/icons/regular/circle-grid-2x2.svg" alt="" width="16" height="16">
                        </button>
                        <button class="toolbar-btn toolbar-btn--icon" aria-label="Adjust columns">
                            <img src="../../.davinci/assets/icons/regular/slider-vertical-3.svg" alt="" width="16" height="16">
                        </button>
                        <button class="toolbar-btn toolbar-btn--icon" aria-label="More options">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Equipment Table -->
                <div class="equip-table-area">
                    <div class="table-container">
                        <table class="table table--equip-list">
                            <thead class="table__head">
                                <tr class="table__row">
                                    <th class="table__header table__header--checkbox">
                                        <label class="checkbox">
                                            <input type="checkbox" class="checkbox__input" id="select-all">
                                            <span class="checkbox__box"></span>
                                        </label>
                                    </th>
                                    <th class="table__header table__header--expand"></th>
                                    <th class="table__header sortable" data-column="name">
                                        Equipment name
                                        <span class="sort-indicator"><span class="sort-indicator__inner" aria-hidden="true"><span class="sort-indicator__icon sort-indicator__up"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M858.9 689L530.5 308.2c-9.4-10.9-27.5-10.9-37 0L165.1 689c-12.2 14.2-1.2 35 18.5 35h656.8c19.7 0 30.7-20.8 18.5-35z"/></svg></span><span class="sort-indicator__icon sort-indicator__down"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35z"/></svg></span></span></span>
                                        <button class="add-col-btn" aria-label="Add equipment">
                                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M7 4V10M4 7H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                                        </button>
                                    </th>
                                    <th class="table__header sortable" data-column="shortName">
                                        Short name
                                        <span class="sort-indicator"><span class="sort-indicator__inner" aria-hidden="true"><span class="sort-indicator__icon sort-indicator__up"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M858.9 689L530.5 308.2c-9.4-10.9-27.5-10.9-37 0L165.1 689c-12.2 14.2-1.2 35 18.5 35h656.8c19.7 0 30.7-20.8 18.5-35z"/></svg></span><span class="sort-indicator__icon sort-indicator__down"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35z"/></svg></span></span></span>
                                    </th>
                                    <th class="table__header" data-column="vendorDfm">Vendor DFM Statuses</th>
                                    <th class="table__header" data-column="processFlow">Process Flow Usage</th>
                                    <th class="table__header sortable" data-column="department">
                                        Department
                                        <span class="sort-indicator"><span class="sort-indicator__inner" aria-hidden="true"><span class="sort-indicator__icon sort-indicator__up"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M858.9 689L530.5 308.2c-9.4-10.9-27.5-10.9-37 0L165.1 689c-12.2 14.2-1.2 35 18.5 35h656.8c19.7 0 30.7-20.8 18.5-35z"/></svg></span><span class="sort-indicator__icon sort-indicator__down"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35z"/></svg></span></span></span>
                                    </th>
                                    <th class="table__header sortable" data-column="category">
                                        Category
                                        <span class="sort-indicator"><span class="sort-indicator__inner" aria-hidden="true"><span class="sort-indicator__icon sort-indicator__up"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M858.9 689L530.5 308.2c-9.4-10.9-27.5-10.9-37 0L165.1 689c-12.2 14.2-1.2 35 18.5 35h656.8c19.7 0 30.7-20.8 18.5-35z"/></svg></span><span class="sort-indicator__icon sort-indicator__down"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35z"/></svg></span></span></span>
                                    </th>
                                    <th class="table__header" data-column="engIntent">ENG Intent</th>
                                    <th class="table__header sortable" data-column="mpIntent">
                                        MP Intent
                                        <span class="sort-indicator"><span class="sort-indicator__inner" aria-hidden="true"><span class="sort-indicator__icon sort-indicator__up"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M858.9 689L530.5 308.2c-9.4-10.9-27.5-10.9-37 0L165.1 689c-12.2 14.2-1.2 35 18.5 35h656.8c19.7 0 30.7-20.8 18.5-35z"/></svg></span><span class="sort-indicator__icon sort-indicator__down"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35z"/></svg></span></span></span>
                                    </th>
                                    <th class="table__header sortable" data-column="riskOpportunity">
                                        Risk and Opportunity
                                        <span class="sort-indicator"><span class="sort-indicator__inner" aria-hidden="true"><span class="sort-indicator__icon sort-indicator__up"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M858.9 689L530.5 308.2c-9.4-10.9-27.5-10.9-37 0L165.1 689c-12.2 14.2-1.2 35 18.5 35h656.8c19.7 0 30.7-20.8 18.5-35z"/></svg></span><span class="sort-indicator__icon sort-indicator__down"><svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor"><path d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35z"/></svg></span></span></span>
                                    </th>
                                    <th class="table__header" data-column="vendor">Vendor</th>
                                </tr>
                            </thead>
                            <tbody class="table__body" id="equip-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Toolbar -->
        <div class="proj-right-toolbar">
            <div class="proj-right-toolbar__header">
                <button class="proj-right-toolbar__toggle">
                    <img src="../../.davinci/assets/icons/regular/chevron-left.svg" alt="" width="14" height="14" class="proj-right-toolbar__chevron">
                </button>
            </div>
            <nav class="proj-right-toolbar__nav"></nav>
            <div class="proj-right-toolbar__panel">
                <div class="proj-right-toolbar__content"></div>
            </div>
        </div>

        <script id="proj-right-toolbar-items-template" type="text/x-handlebars-template">
            {{#each items}}
            <button class="proj-right-toolbar__item {{#if active}}proj-right-toolbar__item--active{{/if}}" data-item-id="{{id}}" title="{{label}}">
                <span class="proj-right-toolbar__item-icon">
                    <img src="{{iconPath}}" alt="" width="16" height="16">
                </span>
                <span class="proj-right-toolbar__item-label">{{label}}</span>
                {{#if badge}}<span class="proj-right-toolbar__item-badge">{{badge}}</span>{{/if}}
            </button>
            {{/each}}
        </script>
    </script>

    <!-- Load the DaVinci Canvas Framework -->
    <script src="../../.davinci/assets/canvas/davinci-canvas.js"></script>

    <!-- Plugin scripts (right-toolbar provides the moon button that toggles dark mode) -->
    <script src="../../.davinci/plugins/proj-right-toolbar.js"></script>

    <!-- Page-specific JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/build-stages.js"></script>
    <script src="js/table.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
