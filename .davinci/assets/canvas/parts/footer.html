<!-- Footer -->
<!--
  Three optional regions, all authored in .davinci/config.json under canvas.footer.
  There is deliberately NO default markup here: the DaVinci default for `center` lives in
  DEFAULT_FOOTER_CENTER in davinci-canvas.js, which resolveChrome substitutes for an absent key.
  That is what makes an explicitly emptied region ("") render nothing instead of springing back.
  Reusable classes for authored content: footer__link, footer__separator, footer__disclaimer.
-->
{{#if footer.visible}}
<footer class="footer">
    <div class="footer__content">
        <div class="footer__region footer__region--left">{{{footer.left}}}</div>
        <div class="footer__region footer__region--center">{{{footer.center}}}</div>
        <div class="footer__region footer__region--right">{{{footer.right}}}</div>
    </div>
</footer>
{{/if}}
