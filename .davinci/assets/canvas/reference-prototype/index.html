<!DOCTYPE html>
<!-- Template only, not runnable here. Copy into prototypes/<name>/ (2 levels deep) so the ../../.davinci/ paths resolve. Drop this banner when you copy. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Prototype - DaVinci</title>
    <!-- Only prototype CSS; MDS and canvas CSS auto-load. -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- App container; canvas injects header, main, and footer here. -->
    <div id="app"></div>

    <!-- 1. PAGE CONTENT: structure only. NO nested <script> tags inside this script. -->
    <script id="page-content" type="text/html">
        <!-- Subheader is auto-rendered from canvas-navigation-data.json. Do not add one here. -->
        <div class="reference-prototype-page">
            <h1>Reference Prototype</h1>
            <p class="reference-prototype-page__intro">Minimal structure showing init pattern, MDS components, and Handlebars templating.</p>

            <div class="form-group form-group--medium reference-prototype-page__field">
                <label class="form-label" for="example-input">Example Input</label>
                <input type="text" id="example-input" class="form-input" placeholder="Type something...">
            </div>

            <!-- Literal space between icon and label. -->
            <button class="btn btn--primary btn--medium" id="example-button">
                <sf-symbol name="sparkles"></sf-symbol>
                Click Me
            </button>

            <div id="output" hidden>
                <p></p>
            </div>

            <!-- table-container--bleed: page-level table only, never inside a modal/card/drawer. -->
            <h2 class="reference-prototype-page__section-title">Items</h2>
            <div class="table-container table-container--bleed">
                <table class="table">
                    <thead class="table__head">
                        <tr class="table__row">
                            <th class="table__header">ID</th>
                            <th class="table__header">Name</th>
                            <th class="table__header">Status</th>
                        </tr>
                    </thead>
                    <tbody class="table__body" id="items-tbody"></tbody>
                </table>
            </div>
        </div>
    </script>

    <!-- 2. Handlebars templates: siblings of page-content, never nested. HTML5 closes the outer <script> at the first </script>. -->
    <script id="items-template" type="text/x-handlebars-template">
        {{#each items}}
        <tr class="table__row">
            <td class="table__cell">{{id}}</td>
            <td class="table__cell">{{name}}</td>
            <td class="table__cell">{{status}}</td>
        </tr>
        {{/each}}
    </script>

    <!-- 3. DaVinci canvas (loads MDS, plugins, templates) -->
    <script src="../../.davinci/assets/canvas/davinci-canvas.js"></script>

    <!-- 4. Prototype JS (always last) -->
    <script src="js/main.js"></script>
</body>
</html>
