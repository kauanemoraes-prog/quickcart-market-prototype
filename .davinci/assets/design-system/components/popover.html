<!-- POPOVER -->
<!-- Popovers display rich content in a floating container -->

<!-- METADATA
Component: Popover
Category: Overlay
Complexity: Medium

CRITICAL STRUCTURE REQUIREMENTS:
- MUST use popover__trigger wrapper div (provides relative positioning context)
- Trigger element (button/link) and popover div are siblings inside popover__trigger
- MUST include popover__arrow div as last child inside popover
- popover__content contains header, body, and optional footer
- popover__header and popover__footer are optional

PLACEMENT CLASSES:
- popover--top: Opens above the trigger
- popover--bottom: Opens below the trigger (DEFAULT)
- popover--left: Opens to the left of the trigger
- popover--right: Opens to the right of the trigger

PLACEMENT GUIDELINES (IMPORTANT FOR LLM):
The HTML class sets the PREFERRED position. MDS JavaScript will automatically flip
to the opposite side at runtime if the popover would overflow the viewport.

When choosing the initial placement class, follow these rules:
- Trigger near TOP of page → use popover--bottom (opens downward, away from edge)
- Trigger near BOTTOM of page → use popover--top (opens upward, away from edge)
- Trigger near RIGHT edge → use popover--left (opens leftward, away from edge)
- Trigger near LEFT edge → use popover--right (opens rightward, away from edge)
- Trigger in CENTER of page → use popover--bottom (default, most natural reading flow)
- Table row actions (right-aligned) → use popover--left or popover--bottom
- Toolbar/header buttons → use popover--bottom
- Footer elements → use popover--top
- Sidebar controls (left) → use popover--right
- Sidebar controls (right) → use popover--left

RUNTIME AUTO-FLIP BEHAVIOR:
The positionPopover() function in MDS JS measures available viewport space and
flips the popover to the opposite side if the preferred side lacks room.
This means the HTML class is a hint — the final position may differ at runtime.
The CSS class is swapped dynamically so the arrow always points correctly.

COMMON MISTAKES TO AVOID:
❌ Using popover--bottom for triggers at the bottom of the page (use popover--top)
❌ Using popover--right for triggers near the right viewport edge (use popover--left)
❌ Forgetting the popover__trigger wrapper div
❌ Forgetting the popover__arrow div
❌ Creating custom popover/tooltip CSS instead of using MDS popover component
❌ Using display:block/none manually — MDS JS handles toggle via popover--open class

JAVASCRIPT INTEGRATION:
- MDS auto-initializes popovers — no custom JS needed for basic open/close
- Two init methods: ID-based ([id]-trigger + [id]) or DOM traversal (.popover__trigger container)
- Click outside or Escape key closes all open popovers automatically
- Use window.closePopover(popoverId) to close programmatically (ID-based popovers)
- Adding class popover-trigger to buttons inside popover footer auto-closes on click

WHEN TO PROMPT (for LLM):
- Always use popover--bottom unless layout context suggests otherwise
- If user specifies "dropdown menu" or "action menu" → popover--bottom
- If user specifies "tooltip-like" above element → popover--top
- Don't ask user about placement — infer from trigger position in the layout
- DO ask about content type: simple text, menu items, or form

Conventions:
- Action menus → popover--bottom with popover__menu structure
- Inline forms → popover--bottom with min-width override
- Context help → popover--top (appears above, like tooltip)
-->

<!-- BASIC POPOVER (BOTTOM PLACEMENT) -->
<div class="popover__trigger">
  <button class="btn btn--primary btn--medium popover-trigger">
    Click for Popover
  </button>
  <div class="popover popover--bottom">
    <div class="popover__content">
      <div class="popover__header">
        <h4 class="popover__title">Popover Title</h4>
      </div>
      <div class="popover__body">
        This is a basic popover with a title and body content. It can contain any HTML content.
      </div>
    </div>
    <div class="popover__arrow"></div>
  </div>
</div>

<!-- FORM IN POPOVER -->
<div class="popover__trigger">
  <button class="btn btn--primary btn--medium popover-trigger">
    Quick Form
  </button>
  <div class="popover popover--bottom" style="min-width: 28rem;">
    <div class="popover__content">
      <div class="popover__header">
        <h4 class="popover__title">Add Comment</h4>
      </div>
      <div class="popover__body">
        <div class="form-group" style="margin-bottom: var(--space-m);">
          <label class="form-label" for="popover-comment">Comment</label>
          <textarea id="popover-comment" class="form-textarea" placeholder="Enter your comment..." style="min-height: 8rem;"></textarea>
        </div>
      </div>
      <div class="popover__footer">
        <button class="btn btn--secondary btn--small popover-trigger">Cancel</button>
        <button class="btn btn--primary btn--small popover-trigger">Submit</button>
      </div>
    </div>
    <div class="popover__arrow"></div>
  </div>
</div>

<!-- USAGE:
- Four placement options: popover--top, popover--bottom, popover--left, popover--right
- Placement class is the PREFERRED position; MDS JS auto-flips if viewport space is insufficient
- Choose placement based on trigger location: top of page→bottom, bottom→top, right edge→left, left edge→right
- popover__trigger wraps both the trigger element and the popover
- popover__content contains header, body, and optional footer
- popover__arrow provides the pointing arrow visual (auto-adjusts with placement)
- popover__header and popover__footer are optional
- Can contain menus (popover__menu), forms, or custom content
- Use popover__menu-divider to separate menu items
- MDS JS handles open/close automatically (click trigger, click outside, Escape key)
- Set min-width inline for wider popovers (forms, etc.)
-->
