<!-- NOTIFICATIONS -->
<!-- Contextual feedback messages - inline (static) or toast (top center) -->

<!-- METADATA
Component: Notification
Category: Feedback
Complexity: Low-Medium

CRITICAL STRUCTURE REQUIREMENTS:
- MUST use notification wrapper div with variant class
- MUST include three sections: notification__icon, notification__content, notification__close
- Variant classes: notification--info, notification--success, notification--warning, notification--error
- MUST include semantic SVG icon in notification__icon
- MUST include notification__message in notification__content
- MUST include notification__close button

COMMON MISTAKES TO AVOID:
❌ Missing variant class (notification--info, etc.)
❌ Omitting notification__icon, notification__content, or notification__close
❌ Using generic icons instead of semantic SVGs provided
❌ Missing notification__message wrapper inside notification__content
❌ Creating custom notification structure instead of using MDS classes

JAVASCRIPT INTEGRATION:
Static notifications (inline):
- Add click handler to notification__close to remove notification from DOM
- Consider fade-out animation before removal

Toast notifications (top center, auto-dismiss):
- Use MDS function: showNotification(type, message)
- Types: 'success', 'error', 'warning', 'info'
- Message is optional - uses default if not provided
- Automatically positioned at top center and auto-dismisses after 3 seconds

CORRECT STRUCTURE TEMPLATE:
<div class="notification notification--success">
  <div class="notification__icon">
    <svg># Semantic icon SVG #</svg>
  </div>
  <div class="notification__content">
    <div class="notification__message">
      <strong>Success:</strong> Your message here
    </div>
  </div>
  <button class="notification__close" aria-label="Close">×</button>
</div>

When to prompt: Ask for type only if context doesn't make it clear (success/error/warning/info)
Variants: Info (blue), Success (green), Warning (orange), Error (red)
-->

<!-- USAGE:
- Static notifications are displayed inline within content flow
- Four variants: notification--info, notification--success, notification--warning, notification--error
- Each notification includes icon, content, and close button
- notification__icon contains the semantic SVG icon
- notification__message contains the message text
- notification__close button allows users to dismiss
- For toast notifications (top center, auto-dismiss), use JavaScript: showNotification(type, message)
- Toast types: 'success', 'error', 'warning', 'info'
- Toast message is optional - uses default if not provided
-->
