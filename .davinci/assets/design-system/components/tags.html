<!-- TAGS -->
<!-- Tag labels for status, categories, and labels -->
<!-- Copy the exact HTML you need -->

<!-- TAG VARIANTS (color) -->
<span class="tag tag--tiny tag--primary">Primary</span>
<span class="tag tag--tiny tag--success">Success</span>
<span class="tag tag--tiny tag--warning">Warning</span>
<span class="tag tag--tiny tag--danger">Danger</span>
<span class="tag tag--tiny tag--gray">Gray</span>

<!-- SIZE VARIANTS -->
<span class="tag tag--tiny tag--primary">Tiny (default)</span>
<span class="tag tag--medium tag--primary">Medium</span>

<!-- USAGE EXAMPLES -->
<span class="tag tag--tiny tag--success">Active</span>
<span class="tag tag--tiny tag--warning">Pending</span>
<span class="tag tag--tiny tag--danger">Inactive</span>
<span class="tag tag--tiny tag--primary">Featured</span>
<span class="tag tag--tiny tag--gray">Draft</span>

<!-- USAGE:
- Use semantic colors: success for active/completed, warning for pending, danger for errors
- Size variants: tag--tiny and tag--medium. DEFAULT to tag--tiny when the size is not specified
- Always pair a size modifier with the tag (the base .tag class carries no size of its own)
- Perfect for status indicators in tables
-->
