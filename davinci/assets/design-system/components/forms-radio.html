<!-- RADIO BUTTON -->
<!-- Radio buttons for single selection from multiple options -->
<!-- Copy the exact HTML you need -->

<!-- SELECTED RADIO -->
<label class="radio">
  <input type="radio" name="radio-group" class="radio__input" checked>
  <span class="radio__circle"></span>
  <span class="radio__label">Option 1</span>
</label>

<!-- UNSELECTED RADIO -->
<label class="radio">
  <input type="radio" name="radio-group" class="radio__input">
  <span class="radio__circle"></span>
  <span class="radio__label">Option 2</span>
</label>

<!-- DISABLED RADIO -->
<label class="radio">
  <input type="radio" name="radio-group" class="radio__input" disabled>
  <span class="radio__circle"></span>
  <span class="radio__label">Disabled option</span>
</label>

<!-- USAGE:
- Use for single selection where users can select only one option from a group
- All radio buttons in a group must share the same 'name' attribute
- Always include radio__circle span for custom styling
- Always include radio__label span for the label text
- The label wraps all elements for better click area
- No size variants - radio uses consistent styling
-->
