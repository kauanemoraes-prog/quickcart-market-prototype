<!-- Checkbox for multiple selections -->
<!-- Copy the exact HTML you need -->

<!-- CHECKED CHECKBOX -->
<label class="checkbox">
  <input type="checkbox" class="checkbox__input" checked>
  <span class="checkbox__box"></span>
  <span class="checkbox__label">Checked checkbox</span>
</label>

<!-- UNCHECKED CHECKBOX -->
<label class="checkbox">
  <input type="checkbox" class="checkbox__input">
  <span class="checkbox__box"></span>
  <span class="checkbox__label">Unchecked checkbox</span>
</label>

<!-- DISABLED CHECKBOX -->
<label class="checkbox">
  <input type="checkbox" class="checkbox__input" disabled>
  <span class="checkbox__box"></span>
  <span class="checkbox__label">Disabled checkbox</span>
</label>

<!-- USAGE:
- Use for multiple selections where users can select zero, one, or many options
- Always include checkbox__box span for custom styling
- Always include checkbox__label span for the label text
- The label wraps all elements for better click area
- No size variants - checkbox uses consistent styling
-->
