<!-- CARDS -->
<!-- Cards contain content and actions about a single subject -->
<!-- Copy the exact HTML you need -->

<!-- CARD WITH HEADER -->
<div class="card">
  <div class="card__header">
    <h3 class="card__title">Card with Header</h3>
  </div>
  <div class="card__body">
    <p style="color: var(--color-glyph-gray-secondary); font-size: var(--font-size-xxs); margin: 0;">
      This is a card with a header. Cards are flexible containers for grouping related content.
    </p>
  </div>
</div>

<!-- SIMPLE CARD WITH FOOTER -->
<div class="card">
  <div class="card__body">
    <h4 style="margin: 0 0 var(--space-s) 0; color: var(--color-glyph-gray); font-size: var(--font-size-xs);">Simple Card</h4>
    <p style="color: var(--color-glyph-gray-secondary); font-size: var(--font-size-xxs); margin: 0;">
      This is a simple card without a header. Perfect for displaying concise information.
    </p>
  </div>
  <div class="card__footer">
    <button class="btn btn--link btn--small">Learn More →</button>
  </div>
</div>

<!-- CARD WITH ALL SECTIONS -->
<div class="card">
  <div class="card__header">
    <h3 class="card__title">Complete Card</h3>
  </div>
  <div class="card__body">
    <p style="color: var(--color-glyph-gray-secondary); font-size: var(--font-size-xxs); margin: 0;">
      Card content goes here. You can include any HTML content.
    </p>
  </div>
  <div class="card__footer">
    <button class="btn btn--secondary btn--medium">Cancel</button>
    <button class="btn btn--primary btn--medium">Save</button>
  </div>
</div>

<!-- USAGE:
- Cards can have header, body, and footer sections
- All sections are optional - use only what you need
- card__header contains the card title
- card__body contains the main content
- card__footer typically contains actions or links
- No size variants - cards expand to fit their container
- Use in grid layouts for responsive card arrangements
-->
