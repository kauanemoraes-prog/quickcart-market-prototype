<!-- BUTTONS -->
<!-- All button variants and sizes -->
<!-- Copy the exact HTML you need -->

<!-- PRIMARY BUTTONS -->
<button class="btn btn--primary btn--small">Small Primary</button>
<button class="btn btn--primary btn--medium">Medium Primary</button>

<!-- SECONDARY BUTTONS -->
<button class="btn btn--secondary btn--small">Small Secondary</button>
<button class="btn btn--secondary btn--medium">Medium Secondary</button>

<!-- SUCCESS BUTTONS -->
<button class="btn btn--success btn--small">Small Success</button>
<button class="btn btn--success btn--medium">Medium Success</button>

<!-- WARNING BUTTONS -->
<button class="btn btn--warning btn--small">Small Warning</button>
<button class="btn btn--warning btn--medium">Medium Warning</button>

<!-- DANGER BUTTONS -->
<button class="btn btn--danger btn--small">Small Danger</button>
<button class="btn btn--danger btn--medium">Medium Danger</button>

<!-- LINK BUTTONS -->
<button class="btn btn--link btn--small">Small Link</button>
<button class="btn btn--link btn--medium">Medium Link</button>

<!-- DISABLED STATE (works with all variants) -->
<button class="btn btn--primary btn--medium" disabled>Disabled Button</button>

<!-- USAGE:
- Always include both variant (btn--primary) and size (btn--medium) classes
- Medium is the default size
- Use semantic variants: primary for main actions, danger for destructive actions
-->
