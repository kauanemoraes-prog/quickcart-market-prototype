<!-- PROJ-RIGHT-TOOLBAR -->
<!-- Fixed right-side toolbar panel with collapsed (40px) and expanded (300px) states -->

<!-- METADATA
Component: Right Toolbar
Category: Layout
Complexity: Medium

CRITICAL STRUCTURE REQUIREMENTS:
- MUST use proj-right-toolbar wrapper div (fixed-position container)
- MUST wrap toggle button in proj-right-toolbar__header div (6rem height, border-bottom)
- MUST include proj-right-toolbar__toggle button with chevron icon inside header
- MUST include proj-right-toolbar__nav for dynamic nav items (rendered by JS)
- MUST use proj-right-toolbar__panel for expandable content area below nav
- Add proj-right-toolbar--open class to expand (300px); remove to collapse (40px)

COMMON MISTAKES TO AVOID:
[X] Forgetting --open class toggle (toolbar won't expand)
[X] Missing toggle button (no way to open/close)
[X] Missing __nav element (items won't render)
[X] Putting nav items inside __panel (won't be visible when closed)

JAVASCRIPT INTEGRATION:
- ProjRightToolbar.init() — binds toggle + renders default items into empty __nav
- ProjRightToolbar.setItems(el, items) — render custom items array
- ProjRightToolbar.open(el), .close(el), .toggle(el) — programmatic state
- Items array format: [{ id: 'settings', icon: 'gearshape.svg', label: 'Settings' }]
- Optional data-icon-path attribute overrides default icon base path

COMPANION FILES:
- CSS: proj-right-toolbar.css
- JS: proj-right-toolbar.js

CORRECT STRUCTURE TEMPLATE:
<div class="proj-right-toolbar">
  <div class="proj-right-toolbar__header">
    <button class="proj-right-toolbar__toggle">
      <lucide-icon class="proj-right-toolbar__chevron" name="chevron.left" style="font-size:14px"></lucide-icon>
    </button>
  </div>
  <nav class="proj-right-toolbar__nav"></nav>
  <div class="proj-right-toolbar__panel">
    <div class="proj-right-toolbar__content">
      Content here
    </div>
  </div>
</div>

REQUIRED HANDLEBARS TEMPLATE (inside page-content):
<script id="proj-right-toolbar-items-template" type="text/x-handlebars-template">
  {{#each items}}
  <button class="proj-right-toolbar__item" data-item-id="{{id}}">
    <span class="proj-right-toolbar__item-icon">
      <img src="{{../basePath}}{{icon}}" alt="" width="16" height="16">
    </span>
    <span class="proj-right-toolbar__item-label">{{label}}</span>
  </button>
  {{/each}}
</script>

When to prompt: Never — component has a single variant
Variants: base (collapsed/expanded via --open class)
-->

<!-- Copy the exact HTML you need -->

<!-- COMPONENT + REQUIRED HANDLEBARS TEMPLATE -->
<div class="proj-right-toolbar">
    <div class="proj-right-toolbar__header">
        <button class="proj-right-toolbar__toggle" aria-label="Open toolbar">
            <lucide-icon class="proj-right-toolbar__chevron" name="chevron.left" style="font-size:14px"></lucide-icon>
        </button>
    </div>
    <nav class="proj-right-toolbar__nav"></nav>
    <div class="proj-right-toolbar__panel">
        <div class="proj-right-toolbar__content">
            <!-- Your toolbar content here -->
        </div>
    </div>
</div>

<!-- Nav items template (place inside page-content) -->
<script id="proj-right-toolbar-items-template" type="text/x-handlebars-template">
    {{#each items}}
    <button class="proj-right-toolbar__item" data-item-id="{{id}}">
        <span class="proj-right-toolbar__item-icon">
            <img src="{{../basePath}}{{icon}}" alt="" width="16" height="16">
        </span>
        <span class="proj-right-toolbar__item-label">{{label}}</span>
    </button>
    {{/each}}
</script>

<!-- USAGE:
- Fixed to the right edge of the viewport, between subheader and footer
- Collapsed: 40px wide — shows icon-only nav items + chevron toggle
- Expanded: 300px wide — shows icon + label for each nav item
- Header: 6rem height with border-bottom, contains toggle chevron
- Nav items: rendered dynamically from JS items array (default: Settings)
- Customize items per-prototype via ProjRightToolbar.setItems(el, items)
- Panel content sits below nav, hidden when collapsed, slides in on open
- Content area scrolls independently if it overflows
-->
