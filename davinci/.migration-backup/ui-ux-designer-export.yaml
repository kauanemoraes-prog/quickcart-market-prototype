      ═══════════════════════════════════════════════════════════════════════════════
      COMMON PITFALLS
      ═══════════════════════════════════════════════════════════════════════════════

      1. **Adding padding to page wrapper**:
         ❌ `.my-page { padding: var(--space-l) }`
         → ✅ `.my-page { /* NO padding - canvas has it */ }`

      2. **Overriding MDS typography**:
         ❌ `h1 { font-size: 32px; font-family: Arial; }`
         → ✅ Use semantic HTML, let MDS handle styling

      3. **Forgot navigation**: Navigation entry should be automatically added during prototype creation

      4. **Wrong paths**: Use ../../assets/ (prototypes are 2 levels deep)

      5. **Old init pattern**:
         ❌ setTimeout(init, 200)
         → ✅ addEventListener('davinci:canvas:ready', safeInit)

      6. **Monolithic JS file (THRESHOLD VIOLATION)**:
         ❌ Single script.js or js/main.js with >500 lines
         → ✅ MANDATORY: Automatically refactor to modular js/ folder with feature-specific files
         ⚠️ When modifying existing prototypes: Check line count FIRST, migrate if >500 lines before making changes
         ℹ️ Legacy prototypes under threshold are fine - only migrate when threshold exceeded

      7. **Monolithic CSS file (THRESHOLD VIOLATION)**:
         ❌ Single styles.css with >300 lines
         → ✅ MANDATORY: Automatically refactor to modular css/ folder with feature-specific files and main.css with @imports
         ⚠️ When modifying existing prototypes: Check line count FIRST, migrate if >300 lines before making changes
         ℹ️ Legacy prototypes under threshold are fine - only migrate when threshold exceeded

      8. **Rewriting MDS behaviors**:
         ❌ Custom modal/drawer/table-sort implementations
         → ✅ Reuse existing MDS component behaviors

      9. **Custom MDS HTML**: Copy from monalisa-design-system/components/[component].html, don't create from memory

      10. **Incorrect component structure** (Read METADATA headers):
         ❌ Pagination: Using buttons for page numbers, missing two-group layout, wrong wrapper
         ❌ Tables: Missing table-container wrapper, wrong class names, no sort-icon span
         ❌ Modal/Drawer: Missing overlay wrapper, forgetting --open class, wrong section structure
         ❌ Tabs: Using <a> instead of <button>, missing data-tab attribute, multiple active tabs
         ❌ Forms: Missing form-group wrapper, no label for/id pairing, wrong size classes
         ❌ Notifications: Missing variant class, wrong icon structure, incomplete sections
         → ✅ ALWAYS read component METADATA header first, copy exact structure, never modify

      11. **CSS placement**: Must be in <head> before scripts (link to styles.css OR css/main.css)

      12. **Editing assets**: Only modify prototypes/*, canvas-navigation-data.json (workspace root), and plugins/*

      13. **Wrong icon source**:
         ❌ Custom SVG or emoji when SF Symbol exists
         → ✅ Search assets/icons/ first with glob pattern

      14. **Oversized icons**:
         ❌ Icons larger than 28px
         → ✅ Max 28px, typically 12-20px

      15. **Icon color violations**:
         ❌ Multiple accent colors via icons
         → ✅ One accent max, rest use gray hierarchy

      16. **Responsive styles**:
         ❌ @media (max-width: ...) or mobile breakpoints
         → ✅ No responsive styles — desktop-only, canvas enforces 1440px min-width

      17. **Stale PROTOTYPE.md**:
         ❌ Skipping update after adding components/features/modules
         → ✅ Check update triggers after every modification task

      18. **Skipping plugin check**:
         ❌ Writing custom CSS without checking plugins
         → ✅ Check MDS first, then plugins/_component-index.md

      19. **Plugin naming collision**:
         ❌ card.html in plugins (conflicts with MDS)
         → ✅ Use project prefix: proj-card.html

      20. **Plugin CSS not registered**:
         ❌ Created plugin CSS but forgot @import in plugins.css
         → ✅ Always register in plugins.css

      21. **Plugin overriding MDS**:
         ❌ Plugin CSS that overrides MDS component styles
         → ✅ Plugin styles only target prefixed classes

      ═══════════════════════════════════════════════════════════════════════════════
      TROUBLESHOOTING
      ═══════════════════════════════════════════════════════════════════════════════

      **Canvas not loading**: Script order, path to davinci-canvas.js, JS errors, missing page-content tag

      **Styles not applying**: CSS not in <head>, wrong path (check styles.css vs css/main.css), file missing, @import path errors in modular structure, specificity issues

      **MDS not styled**: Auto-load failed (check console), wrong classes, custom CSS conflicts

      **Navigation broken**: JSON syntax error, wrong path, file not updated/saved, editing wrong file (use workspace root, not assets/canvas/)

      **JS not running**: Old setTimeout pattern, wrong script order (main.js must be last in modular structure), syntax error, missing IIFE

      **Module not found**: Check script src paths (js/filename.js), load order (features before main.js), verify js/ folder exists

      **Legacy prototype issues**: Old prototypes use script.js directly - check that file exists and path is correct

      **Content outside canvas**: Not in page-content tag, manual navbar/footer added

      **Subheader missing**: Check navigation data has subHeader property (string or object with htmlContent), verify JSON syntax, ensure not set to null/false

      **Plugin component not styled**: Check companion CSS has @import in plugins.css, verify file exists in plugins/, check class name prefix matches

      **Plugin JS not working**: Check init call added to plugins.js, verify IIFE exposes module on window, check plugins.js loaded in console (Network tab)

      **Subheader HTML not rendering**: Verify htmlContent property exists, check quote escaping in JSON (use \"), validate HTML structure, ensure using object format not string

      Debug: F12 → Console (JS errors) → Network (404s) → Compare with reference → Check paths → Validate JSON

