<!-- SWITCH / TOGGLE -->
<!-- Toggle switches for on/off states -->
<!-- Copy the exact HTML you need -->

<!-- DEFAULT SIZE (34px × 18px) - ENABLED -->
<label class="switch">
  <input type="checkbox" class="switch__input" checked>
  <span class="switch__slider"></span>
  <span class="switch__label">Enable notifications</span>
</label>

<!-- DEFAULT SIZE - DISABLED STATE -->
<label class="switch">
  <input type="checkbox" class="switch__input">
  <span class="switch__slider"></span>
  <span class="switch__label">Disable feature</span>
</label>

<!-- DEFAULT SIZE - DISABLED -->
<label class="switch">
  <input type="checkbox" class="switch__input" disabled>
  <span class="switch__slider"></span>
  <span class="switch__label">Disabled switch</span>
</label>

<!-- SMALL SIZE (24px × 14px) - ENABLED -->
<label class="switch switch--small">
  <input type="checkbox" class="switch__input" checked>
  <span class="switch__slider"></span>
  <span class="switch__label">Enable notifications</span>
</label>

<!-- SMALL SIZE - DISABLED STATE -->
<label class="switch switch--small">
  <input type="checkbox" class="switch__input">
  <span class="switch__slider"></span>
  <span class="switch__label">Disable feature</span>
</label>

<!-- SMALL SIZE - DISABLED -->
<label class="switch switch--small">
  <input type="checkbox" class="switch__input" disabled>
  <span class="switch__slider"></span>
  <span class="switch__label">Disabled switch</span>
</label>

<!-- USAGE:
- Use for binary on/off states
- Default size is 34px × 18px
- Small size (switch--small) is 24px × 14px
- Always include switch__slider span for the toggle visual
- Always include switch__label span for the label text
- The label wraps all elements for better click area
- Use checked attribute for the "on" state
-->
