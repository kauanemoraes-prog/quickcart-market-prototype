<!-- PILL -->
<!-- METADATA:
  Name: Pill
  Description: Compact labels with color variants and optional close action
  Variants: grey, blue, orange, yellow, red
  States: default, selected
  When to prompt: When color is not obvious from context
  Conventions: grey = neutral/default, blue = info/primary, orange = warning, yellow = attention, red = danger/error
-->

<!-- DEFAULT PILLS -->
<span class="pill pill--grey">
  <span class="pill__label">Label</span>
  <button class="pill__close"><img src="../../assets/icons/regular/xmark.svg" alt="Remove" width="12" height="12"></button>
</span>

<!-- USAGE:
- Use pill--[color] for the color variant
- Add pill--selected for the solid/selected state
- Close button is optional — remove if pill is not dismissible
- Icon path: ../../assets/icons/regular/xmark.svg (12x12)
- Default: light background, colored icon, gray text
- Selected: solid background, white icon, white text
-->
