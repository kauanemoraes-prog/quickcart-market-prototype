<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components - DaVinci</title>
    <script>try{if(localStorage.getItem('davinci:dark-mode')==='1')document.documentElement.classList.add('dark-mode');}catch(e){}</script>
    <!-- The framework will automatically load all CSS from assets -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- App container where the canvas will be injected -->
    <div id="app"></div>

    <!-- Define your page-content here -->
    <script id="page-content" type="text/html">
        <!-- NOTE: Subheader is handled by canvas automatically via canvas-navigation-data.json -->
        <!-- Do NOT add subheader HTML here - it will create duplicates -->

        <div class="components-page">

            <!-- Page intro -->
            <div class="showcase-intro">
                <p class="showcase-intro__desc">
                    Custom components exclusive to the Apple Core project, built on top of Monalisa Design System. Use these as reference when building Apple Core prototypes.
                </p>
            </div>

            <p>Hello World</p>

            <!-- Page-level tabs -->
            <div class="tabs">
                <div class="tabs__nav">
                    <button class="tabs__tab tabs__tab--active" data-tab="nested-table-tab">Nested Table</button>
                    <button class="tabs__tab" data-tab="timeline-tab">Timeline</button>
                    <button class="tabs__tab" data-tab="right-toolbar-tab">Right Toolbar</button>
                </div>
                <div class="tabs__content">
                    <div class="tabs__panel tabs__panel--active" id="nested-table-tab">

            <!-- ============================================ -->
            <!-- COMPONENT: Nested Table                      -->
            <!-- ============================================ -->
            <section class="component-section" id="nested-table">
                <div class="component-section__header">
                    <h2 class="component-section__title">Nested Table</h2>
                    <p class="component-section__desc">
                        A multilevel expandable table where Level 1 rows expand to reveal a Level 2 detail panel with a completely different column structure. Built on MDS table component with card-style rows, drag handles, and expand/collapse behavior.
                    </p>
                </div>

                <!-- API Reference -->
                <div class="component-group">
                    <h3 class="component-group__title">Configuration</h3>
                    <div class="component-api">
                        <div class="component-api__title">ProjNestedTable.create(config)</div>
                        <table class="component-api__table">
                            <thead>
                                <tr>
                                    <th>Property</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><code>tbodyId</code></td>
                                    <td>string</td>
                                    <td>ID of the tbody element to render into</td>
                                </tr>
                                <tr>
                                    <td><code>level1TemplateId</code></td>
                                    <td>string</td>
                                    <td>Handlebars template ID for Level 1 rows</td>
                                </tr>
                                <tr>
                                    <td><code>level2TemplateId</code></td>
                                    <td>string</td>
                                    <td>Handlebars template ID for the detail panel</td>
                                </tr>
                                <tr>
                                    <td><code>data</code></td>
                                    <td>array</td>
                                    <td>Level 1 data items, each containing a nested children array</td>
                                </tr>
                                <tr>
                                    <td><code>dataKey</code></td>
                                    <td>string</td>
                                    <td>Row attribute for item lookup (e.g. <code>data-line-id</code>)</td>
                                </tr>
                                <tr>
                                    <td><code>idField</code></td>
                                    <td>string</td>
                                    <td>Data property matching the dataKey attribute value</td>
                                </tr>
                                <tr>
                                    <td><code>childrenField</code></td>
                                    <td>string</td>
                                    <td>Property name for the nested array (e.g. <code>stations</code>)</td>
                                </tr>
                                <tr>
                                    <td><code>colspan</code></td>
                                    <td>number</td>
                                    <td>Number of Level 1 columns (for detail row spanning)</td>
                                </tr>
                                <tr>
                                    <td><code>level1DataKey</code></td>
                                    <td>string</td>
                                    <td>Template context key for L1 data (<code>\{{#each key}}</code>)</td>
                                </tr>
                                <tr>
                                    <td><code>level2DataKey</code></td>
                                    <td>string</td>
                                    <td>Template context key for L2 data (<code>\{{#each key}}</code>)</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Live Example -->
                <div class="component-group">
                    <h3 class="component-group__title">Example: Lines → Stations</h3>
                    <div class="component-example__label">Live example — click a chevron to expand</div>
                    <div class="component-example component-example--flush">
                        <section class="proj-nested-table">
                            <div class="table-container">
                                <table class="table">
                                    <thead class="table__head">
                                        <tr class="table__row">
                                            <th class="table__header proj-nested-table__col-index">#</th>
                                            <th class="table__header proj-nested-table__col-name">Line name</th>
                                            <th class="table__header proj-nested-table__col-desc">Line description</th>
                                            <th class="table__header proj-nested-table__col-uph">Target UPH</th>
                                            <th class="table__header proj-nested-table__col-num">Station Count</th>
                                            <th class="table__header proj-nested-table__col-num">Process Count</th>
                                            <th class="table__header proj-nested-table__col-num">HC</th>
                                            <th class="table__header proj-nested-table__col-num">Equip. Count</th>
                                            <th class="table__header proj-nested-table__col-num">Unique Equip. Count</th>
                                            <th class="table__header proj-nested-table__col-num">Unique Cons.</th>
                                        </tr>
                                    </thead>
                                    <tbody class="table__body" id="lines-table-body"></tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                </div>

            </section>

                    </div><!-- /tabs__panel nested-table -->

                    <div class="tabs__panel" id="timeline-tab">

            <!-- ============================================ -->
            <!-- COMPONENT: Timeline                          -->
            <!-- ============================================ -->
            <section class="component-section" id="timeline">
                <div class="component-section__header">
                    <h2 class="component-section__title">Timeline</h2>
                    <p class="component-section__desc">
                        A horizontal read-only milestone timeline. Milestones are evenly spaced along a track with a progress line indicating completion. Each milestone shows a label, a state circle, and a value.
                    </p>
                </div>

                <!-- API Reference -->
                <div class="component-group">
                    <h3 class="component-group__title">Configuration</h3>
                    <div class="component-api">
                        <div class="component-api__title">ProjTimeline.create(config)</div>
                        <table class="component-api__table">
                            <thead>
                                <tr>
                                    <th>Property</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><code>containerId</code></td>
                                    <td>string</td>
                                    <td>ID of the container element to render into</td>
                                </tr>
                                <tr>
                                    <td><code>templateId</code></td>
                                    <td>string</td>
                                    <td>Handlebars template ID for the timeline markup</td>
                                </tr>
                                <tr>
                                    <td><code>milestones</code></td>
                                    <td>array</td>
                                    <td>Array of milestone objects</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="component-api" style="margin-top: var(--space-s);">
                        <div class="component-api__title">Milestone object</div>
                        <table class="component-api__table">
                            <thead>
                                <tr>
                                    <th>Property</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><code>label</code></td>
                                    <td>string</td>
                                    <td>Top label (e.g., "P1", "P2", "MP")</td>
                                </tr>
                                <tr>
                                    <td><code>value</code></td>
                                    <td>string</td>
                                    <td>Bottom value — string or date (e.g., "04/01/2026")</td>
                                </tr>
                                <tr>
                                    <td><code>current</code></td>
                                    <td>boolean</td>
                                    <td>Whether this is the current milestone (shows checkmark)</td>
                                </tr>
                                <tr>
                                    <td><code>selected</code></td>
                                    <td>boolean</td>
                                    <td>Whether this milestone is selected (blue line fills to here)</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Live Examples -->
                <div class="component-group">
                    <h3 class="component-group__title">Examples</h3>
                    <div class="component-example__label">Scenario 1 — P1 is current and selected</div>
                    <div class="component-example">
                        <div id="timeline-demo-1"></div>
                    </div>
                    <div class="component-example__label">Scenario 2 — P1 is current, P2 is selected</div>
                    <div class="component-example">
                        <div id="timeline-demo-2"></div>
                    </div>
                    <div class="component-example__label">Scenario 3 (6 dots) — P2 is current and selected</div>
                    <div class="component-example">
                        <div id="timeline-demo-3"></div>
                    </div>
                    <div class="component-example__label">Scenario 4 (6 dots) — P2 is selected, P3 is current</div>
                    <div class="component-example">
                        <div id="timeline-demo-4"></div>
                    </div>
                    <div class="component-example__label">Scenario 5 (6 dots) — P3 is current, EVT is selected (future)</div>
                    <div class="component-example">
                        <div id="timeline-demo-5"></div>
                    </div>
                    <div class="component-example__label">Scenario 6 (6 dots) — Same as 5, but P3 is draft</div>
                    <div class="component-example">
                        <div id="timeline-demo-6"></div>
                    </div>
                    <div class="component-example__label">Scenario 7 (4 dots)</div>
                    <div class="component-example">
                        <div id="timeline-demo-7"></div>
                    </div>
                </div>

            </section>

                    </div><!-- /tabs__panel timeline -->

                    <div class="tabs__panel" id="right-toolbar-tab">

            <!-- ============================================ -->
            <!-- COMPONENT: Right Toolbar                     -->
            <!-- ============================================ -->
            <section class="component-section" id="right-toolbar">
                <div class="component-section__header">
                    <h2 class="component-section__title">Right Toolbar</h2>
                    <p class="component-section__desc">
                        A fixed right-side collapsible panel. Collapsed state is 30px wide showing only a chevron toggle; expanded state grows to 300px with an ease-in-out animation. Useful for persistent side tools, settings panels, or contextual information.
                    </p>
                </div>

                <!-- API Reference -->
                <div class="component-group">
                    <h3 class="component-group__title">API</h3>
                    <div class="component-api">
                        <div class="component-api__title">ProjRightToolbar methods</div>
                        <table class="component-api__table">
                            <thead>
                                <tr>
                                    <th>Method</th>
                                    <th>Param</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><code>init()</code></td>
                                    <td>—</td>
                                    <td>Auto-binds toggle click on all <code>.proj-right-toolbar</code> instances</td>
                                </tr>
                                <tr>
                                    <td><code>toggle(el)</code></td>
                                    <td>DOM element</td>
                                    <td>Toggle open/close state</td>
                                </tr>
                                <tr>
                                    <td><code>open(el)</code></td>
                                    <td>DOM element</td>
                                    <td>Expand the toolbar</td>
                                </tr>
                                <tr>
                                    <td><code>close(el)</code></td>
                                    <td>DOM element</td>
                                    <td>Collapse the toolbar</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="component-api" style="margin-top: var(--space-s);">
                        <div class="component-api__title">CSS Class Reference</div>
                        <table class="component-api__table">
                            <thead>
                                <tr>
                                    <th>Class</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><code>proj-right-toolbar</code></td>
                                    <td>Root container — fixed, right-aligned, 30px collapsed</td>
                                </tr>
                                <tr>
                                    <td><code>proj-right-toolbar--open</code></td>
                                    <td>Modifier — expands to 300px, reveals panel content</td>
                                </tr>
                                <tr>
                                    <td><code>proj-right-toolbar__toggle</code></td>
                                    <td>Chevron button — always visible, triggers open/close</td>
                                </tr>
                                <tr>
                                    <td><code>proj-right-toolbar__panel</code></td>
                                    <td>Expandable area — hidden when collapsed, fades in on open</td>
                                </tr>
                                <tr>
                                    <td><code>proj-right-toolbar__content</code></td>
                                    <td>Scrollable content wrapper inside the panel</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Live Example -->
                <div class="component-group">
                    <h3 class="component-group__title">Live Example</h3>
                    <div class="component-example__label">Click the chevron on the right edge of the page to toggle</div>
                    <div class="component-example">
                        <p style="color: var(--color-glyph-gray-secondary); font-size: var(--font-size-xxs);">
                            A live <code>proj-right-toolbar</code> instance is rendered on this page. Look for the chevron icon fixed to the right edge of the viewport. Click it to expand and see sample content inside the panel.
                        </p>
                    </div>
                </div>

            </section>

                    </div><!-- /tabs__panel right-toolbar -->
                </div><!-- /tabs__content -->
            </div><!-- /tabs -->

            <!-- Live Right Toolbar instance -->
            <div class="proj-right-toolbar">
                <div class="proj-right-toolbar__header">
                    <button class="proj-right-toolbar__toggle" aria-label="Open toolbar">
                        <img src="../../davinci/assets/icons/regular/chevron-left.svg" alt="" width="14" height="14" class="proj-right-toolbar__chevron">
                    </button>
                </div>
                <nav class="proj-right-toolbar__nav"></nav>
                <div class="proj-right-toolbar__panel">
                    <div class="proj-right-toolbar__content">
                    </div>
                </div>
            </div>

            <!-- Handlebars: Right Toolbar nav items -->
            <script id="proj-right-toolbar-items-template" type="text/x-handlebars-template">
                {{#each items}}
                <button class="proj-right-toolbar__item" data-item-id="{{id}}">
                    <span class="proj-right-toolbar__item-icon">
                        <img src="{{../basePath}}{{icon}}" alt="" width="16" height="16">
                    </span>
                    <span class="proj-right-toolbar__item-label">{{label}}</span>
                </button>
                {{/each}}
            </script>

            <!-- Handlebars: Level 1 rows (Lines) -->
            <script id="lines-row-template" type="text/x-handlebars-template">
                {{#each lines}}
                <tr class="table__row proj-nested-table__row proj-nested-table__row--level1" data-line-id="{{id}}" data-expanded="false">
                    <td class="table__cell proj-nested-table__col-index">
                        <span class="proj-nested-table__drag-handle" title="Drag to reorder">
                            <img src="../../davinci/assets/icons/regular/square-grid-4x3-fill.svg" alt="" width="10" height="10">
                        </span>
                        <span class="proj-nested-table__row-number">{{index}}</span>
                    </td>
                    <td class="table__cell proj-nested-table__col-name">
                        <button class="proj-nested-table__expand-btn" aria-label="Expand {{name}}">
                            <img src="../../davinci/assets/icons/regular/chevron-forward.svg" alt="" width="10" height="10" class="proj-nested-table__chevron">
                        </button>
                        <span>{{name}}</span>
                    </td>
                    <td class="table__cell proj-nested-table__col-desc">{{description}}</td>
                    <td class="table__cell proj-nested-table__col-uph">{{targetUPH}}</td>
                    <td class="table__cell proj-nested-table__col-num">{{stationCount}}</td>
                    <td class="table__cell proj-nested-table__col-num">{{processCount}}</td>
                    <td class="table__cell proj-nested-table__col-num">{{hc}}</td>
                    <td class="table__cell proj-nested-table__col-num">{{equipCount}}</td>
                    <td class="table__cell proj-nested-table__col-num">{{uniqueEquipCount}}</td>
                    <td class="table__cell proj-nested-table__col-num">{{uniqueCons}}</td>
                </tr>
                {{/each}}
            </script>

            <!-- Handlebars: Level 2 panel (Stations) -->
            <script id="stations-panel-template" type="text/x-handlebars-template">
                <div class="l2">
                    <table class="table l2__table">
                        <thead class="table__head">
                            <tr class="table__row">
                                <th class="table__header l2__col-station">Station info</th>
                                <th class="table__header l2__col-dept">Department</th>
                                <th class="table__header l2__col-cm">CM Department</th>
                                <th class="table__header l2__col-kp">Key Process Description</th>
                                <th class="table__header l2__col-spec">
                                    <img src="../../davinci/assets/icons/regular/list-bullet-rectangle-portrait.svg" alt="" width="14" height="14" class="l2__header-icon">
                                    Specification
                                </th>
                                <th class="table__header l2__col-equip">
                                    <img src="../../davinci/assets/icons/regular/wrench-and-screwdriver.svg" alt="" width="14" height="14" class="l2__header-icon">
                                    Equipment
                                </th>
                                <th class="table__header l2__col-cons">
                                    <img src="../../davinci/assets/icons/regular/drop.svg" alt="" width="14" height="14" class="l2__header-icon">
                                    Consumables
                                </th>
                            </tr>
                        </thead>
                        <tbody class="table__body">
                            {{#each stations}}
                            <tr class="table__row proj-nested-table__row proj-nested-table__row--level2">
                                <!-- Station info -->
                                <td class="table__cell l2__col-station">
                                    <div class="l2__station-cell">
                                        <div class="l2__station-color" style="background: {{color}};"></div>
                                        <div class="l2__station-content">
                                            <div class="l2__station-header">
                                                <span class="proj-nested-table__drag-handle" title="Drag to reorder">
                                                    <img src="../../davinci/assets/icons/regular/square-grid-4x3-fill.svg" alt="" width="10" height="10">
                                                </span>
                                                <span class="proj-nested-table__row-number">{{index}}</span>
                                                <span class="l2__station-name">{{name}}</span>
                                            </div>
                                            <div class="l2__station-tags">
                                                {{#each tags}}
                                                <span class="tag tag--medium tag--{{type}}">{{label}}</span>
                                                {{/each}}
                                            </div>
                                            <div class="l2__station-actions">
                                                <a href="#" class="l2__action-link">
                                                    <img src="../../davinci/assets/icons/regular/gearshape.svg" alt="" width="12" height="12" class="l2__action-icon">
                                                    Settings
                                                </a>
                                                <span class="l2__action-sep">|</span>
                                                <a href="#" class="l2__action-link">
                                                    <img src="../../davinci/assets/icons/regular/plus-circle.svg" alt="" width="12" height="12" class="l2__action-icon">
                                                    Add key process
                                                </a>
                                                <span class="l2__action-sep">|</span>
                                                <a href="#" class="l2__action-link">SDC</a>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <!-- Department -->
                                <td class="table__cell l2__col-dept">
                                    {{#if department}}
                                    <span class="l2__dept-value">{{department}}</span>
                                    <button class="l2__dept-remove" aria-label="Remove department">
                                        <img src="../../davinci/assets/icons/regular/xmark.svg" alt="" width="10" height="10">
                                    </button>
                                    {{/if}}
                                </td>
                                <!-- CM Department -->
                                <td class="table__cell l2__col-cm">
                                    <button class="l2__cm-dropdown" aria-label="Select CM Department">
                                        <img src="../../davinci/assets/icons/regular/chevron-down.svg" alt="" width="10" height="10">
                                    </button>
                                </td>
                                <!-- Key Process Description -->
                                <td class="table__cell l2__col-kp">
                                    {{#each keyProcesses}}
                                    <div class="l2__kp-row">
                                        <span class="proj-nested-table__drag-handle" title="Drag to reorder">
                                            <img src="../../davinci/assets/icons/regular/square-grid-4x3-fill.svg" alt="" width="10" height="10">
                                        </span>
                                        <span class="proj-nested-table__row-number">{{index}}</span>
                                        <span class="l2__kp-name">{{name}}</span>
                                    </div>
                                    {{/each}}
                                </td>
                                <!-- Specification -->
                                <td class="table__cell l2__col-spec">
                                    {{#each keyProcesses}}
                                    <div class="l2__add-row">
                                        <a href="#" class="l2__add-link">
                                            <img src="../../davinci/assets/icons/regular/plus-circle.svg" alt="" width="12" height="12" class="l2__action-icon">
                                            Add specs
                                        </a>
                                    </div>
                                    {{/each}}
                                </td>
                                <!-- Equipment -->
                                <td class="table__cell l2__col-equip">
                                    {{#each keyProcesses}}
                                    <div class="l2__add-row">
                                        {{#if equipment}}
                                        <span class="l2__equip-item">
                                            {{equipment}}
                                            <img src="../../davinci/assets/icons/regular/gearshape.svg" alt="" width="10" height="10" class="l2__equip-icon">
                                        </span>
                                        {{/if}}
                                        <a href="#" class="l2__add-link">
                                            <img src="../../davinci/assets/icons/regular/plus-circle.svg" alt="" width="12" height="12" class="l2__action-icon">
                                            Add equipment
                                        </a>
                                    </div>
                                    {{/each}}
                                </td>
                                <!-- Consumables -->
                                <td class="table__cell l2__col-cons">
                                    {{#each keyProcesses}}
                                    <div class="l2__add-row">
                                        <a href="#" class="l2__add-link">
                                            <img src="../../davinci/assets/icons/regular/plus-circle.svg" alt="" width="12" height="12" class="l2__action-icon">
                                            Add consumable
                                        </a>
                                    </div>
                                    {{/each}}
                                </td>
                            </tr>
                            {{/each}}
                        </tbody>
                    </table>
                </div>
            </script>

            <!-- Handlebars: Timeline -->
            <script id="timeline-template" type="text/x-handlebars-template">
                <div class="proj-timeline">
                    <div class="proj-timeline__track">
                        <div class="proj-timeline__milestones">
                            <div class="proj-timeline__line"></div>
                            <div class="proj-timeline__progress"></div>
                            {{#each milestones}}
                            <div class="proj-timeline__milestone proj-timeline__milestone--{{base}}{{#if isSelected}} proj-timeline__milestone--selected{{/if}}">
                                <span class="proj-timeline__label">{{label}}</span>
                                <div class="proj-timeline__circle">
                                    {{#if hasCheck}}
                                    <img src="../../davinci/assets/icons/regular/checkmark.svg" alt="" width="8" height="8" class="proj-timeline__checkmark">
                                    {{/if}}
                                </div>
                                <span class="proj-timeline__value">{{value}}</span>
                            </div>
                            {{/each}}
                        </div>
                    </div>
                </div>
            </script>

        </div>
    </script>

    <!-- Load the DaVinci Canvas Framework -->
    <script src="../../davinci/assets/canvas/davinci-canvas.js"></script>

    <!-- Page-specific JavaScript -->
    <script src="../../davinci/plugins/proj-nested-table.js"></script>
    <script src="js/lines-stations.js"></script>
    <script src="../../davinci/plugins/proj-timeline.js"></script>
    <script src="../../davinci/plugins/proj-right-toolbar.js"></script>
    <script src="js/timeline-demo.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
