<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Detail - DaVinci</title>
    <script>try{if(localStorage.getItem('davinci:dark-mode')==='1')document.documentElement.classList.add('dark-mode');}catch(e){}</script>
    <!-- The framework will automatically load all CSS from assets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="../components/css/nested-table-lines.css">
    <link rel="stylesheet" href="../components/css/nested-table-stations.css">
</head>
<body>
    <!-- App container where the canvas will be injected -->
    <div id="app"></div>

    <!-- Define your page-specific content here -->
    <script id="page-content" type="text/html">
        <div class="program-detail-page">
            <!-- Program Detail Header -->
            <div class="program-detail-header">
                <div class="program-detail-header__nav">
                    <!-- Back button -->
                    <a href="index.html" class="back-btn" aria-label="Back to programs">
                        <img src="../../davinci/assets/icons/regular/arrow-backward.svg" alt="" width="16" height="16">
                    </a>

                    <!-- Program dropdown -->
                    <div class="header-dropdown">
                        <label class="header-dropdown__label">Program</label>
                        <div class="header-dropdown__select-wrapper">
                            <select id="program-select" class="header-dropdown__select">
                                <!-- Options populated by JavaScript -->
                            </select>
                            <svg class="header-dropdown__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Site dropdown -->
                    <div class="header-dropdown">
                        <label class="header-dropdown__label">Site</label>
                        <div class="header-dropdown__select-wrapper">
                            <select id="site-select" class="header-dropdown__select">
                                <!-- Options populated by JavaScript -->
                            </select>
                            <svg class="header-dropdown__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Timeline -->
                    <div id="program-timeline"></div>

                    <!-- Version and UPH info -->
                    <div class="header-info">
                        <div class="header-info__tags">
                            <span class="tag tag--medium tag--gray mp-tag" id="mp-target-source-tag" style="display:none;">
                                <sf-symbol name="target" class="mp-tag__icon"></sf-symbol>
                                Target - <span id="mp-target-source-name"></span>
                            </span>
                            <span class="tag tag--medium tag--gray" id="program-version-tag">V1 - Draft</span>
                            <span class="tag tag--medium tag--gray mp-tag" id="mp-target-indicator-tag" style="display:none;">
                                <sf-symbol name="target" class="mp-tag__icon"></sf-symbol>
                                MP Target
                            </span>
                            <span class="tag tag--medium tag--success afmd-eligibility-tag" id="afmd-eligibility-tag" data-afmd-eligibility="ready" title="AFMD is reachable, project is registered, site is configured — sync is available.">
                                <sf-symbol name="checkmark.circle.fill" class="afmd-eligibility-tag__icon"></sf-symbol>
                                AFMD
                            </span>
                        </div>
                        <div class="uph-target">
                            <span class="uph-target__label">UPH</span>
                            <span class="uph-target__value">0</span>
                            <button class="edit-btn" aria-label="Edit UPH target">
                                <img src="../../davinci/assets/icons/regular/pencil.svg" alt="" width="12" height="12">
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div class="program-tabs">
                <div class="tabs">
                    <div class="tabs__nav">
                        <button class="tabs__tab tabs__tab--active" data-tab="process-flow">Process Flow</button>
                        <button class="tabs__tab" data-tab="process-flow-2" hidden style="display:none">Process Flow 2</button>
                        <div class="equip-tab-wrapper">
                            <button class="tabs__tab" data-tab="equipment-list"><span class="equip-tab-label">Equipment – List</span> <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="margin-left: 2px; vertical-align: middle;"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                            <ul class="equip-tab-menu" id="equip-tab-menu">
                                <li class="equip-tab-menu__item equip-tab-menu__item--active" data-view="list">
                                    <span>Equipment - List</span>
                                    <svg class="equip-tab-menu__check" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 3.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </li>
                                <li class="equip-tab-menu__item" data-view="comparison">
                                    <span>Equipment - Comparison</span>
                                    <svg class="equip-tab-menu__check" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L6 11L11.5 3.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </li>
                            </ul>
                        </div>
                        <button class="tabs__tab" data-tab="consumables">Consumables</button>
                        <button class="tabs__tab" data-tab="pending-pcns">PCN – Pending <span class="pcn-tab-badge" id="pcn-tab-badge">0</span> <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="margin-left: 2px; vertical-align: middle;"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    </div>
                </div>
                
                <!-- Action buttons aligned with tabs -->
                <div class="tabs-actions">
                    <button class="btn btn--secondary btn--small" id="import-btn">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 8V13H13V8M8 10V3M8 3L5 6M8 3L11 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Import
                    </button>

                    <button class="btn btn--secondary btn--small" id="export-btn">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 3V10M8 10L5 7M8 10L11 7M3 13H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Export
                    </button>

                    <button class="btn btn--primary btn--small" id="publish-btn">Publish</button>
                    <button class="btn btn--primary btn--small mp-edit-target-btn" id="mp-edit-target-btn" type="button">
                        <sf-symbol name="target"></sf-symbol>
                        Edit Target
                    </button>
                </div>
            </div>

            <!-- Page content area -->
            <div class="program-detail-content">
                <div class="tabs__content">
                    <div class="tabs__panel tabs__panel--active" id="process-flow">
                        <!-- Toolbar with filter/search and actions -->
                        <div class="process-toolbar">
                            <div class="pf-filter">
                                <div class="pf-filter__row">
                                    <div class="pf-filter__field">
                                        <span class="pf-filter__icon" aria-hidden="true">
                                            <sf-symbol name="magnifyingglass"></sf-symbol>
                                        </span>
                                        <div class="pf-filter__chips" id="pf1-filter-chips"></div>
                                        <input type="text" class="pf-filter__input" placeholder="Type keywords..." id="lines-search" autocomplete="off">
                                        <div class="pf1-match-nav" id="pf1-match-nav" hidden>
                                            <button type="button" class="pf1-match-nav__btn" data-pf1-nav="prev" aria-label="Previous match">
                                                <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M8 6.5L5 3.5L2 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                            </button>
                                            <button type="button" class="pf1-match-nav__btn" data-pf1-nav="next" aria-label="Next match">
                                                <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                            </button>
                                            <span class="pf1-match-nav__count" id="pf1-match-nav-count">0 of 0</span>
                                        </div>
                                        <span class="pf-filter__shortcut" aria-hidden="true">⌘K</span>
                                        <button type="button" class="pf-filter__clear-all" aria-label="Clear all filters">
                                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 3.5L10.5 10.5M10.5 3.5L3.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                                        </button>
                                    </div>
                                    <button type="button" class="pf-filter__save-btn" aria-label="Save current filter as favorite" aria-pressed="false" hidden>
                                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.75L10.09 6.03L14.72 6.72L11.36 10.05L12.18 14.75L8 12.5L3.82 14.75L4.64 10.05L1.28 6.72L5.91 6.03L8 1.75Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                                    </button>
                                    <button type="button" class="pf-filter__options-btn" aria-label="Filter options" aria-haspopup="true" aria-expanded="false">
                                        <svg width="16" height="4" viewBox="0 0 16 4" fill="none"><circle cx="2" cy="2" r="1.6" fill="currentColor"/><circle cx="8" cy="2" r="1.6" fill="currentColor"/><circle cx="14" cy="2" r="1.6" fill="currentColor"/></svg>
                                    </button>
                                    <div class="pf-filter__options-pop" role="dialog" aria-label="Filter options" hidden></div>
                                    <span class="pf-filter__info-wrap">
                                        <span class="pf-filter__info" aria-label="Filter info" tabindex="0">
                                            <sf-symbol name="info.circle"></sf-symbol>
                                        </span>
                                    </span>
                                </div>
                                <div class="pf-filter__panel" role="dialog" aria-label="Filter options">
                                    <div class="pf-filter__panel-body" data-view="main"></div>
                                </div>
                            </div>

                            <div class="toolbar-actions">
                                <button class="tag-btn tag-btn--active js-toggle-station-info">
                                    <img src="../../davinci/assets/icons/regular/eye.svg" alt="" width="14" height="14">
                                    Station info
                                </button>

                                <button class="tag-btn tag-btn--active">
                                    <img src="../../davinci/assets/icons/regular/eye.svg" alt="" width="14" height="14">
                                    Process info
                                </button>

                                <button class="tag-btn">
                                    <img src="../../davinci/assets/icons/regular/eye.svg" alt="" width="14" height="14">
                                    50
                                </button>

                                <button class="toolbar-btn toolbar-btn--icon" aria-label="Settings">
                                    <img src="../../davinci/assets/icons/regular/gearshape.svg" alt="" width="16" height="16">
                                </button>
                            </div>
                        </div>

                        <section class="proj-nested-table">
                            <div class="table-container">
                                <table class="table table--lines">
                                    <thead class="table__head">
                                        <tr class="table__row">
                                            <th class="table__header proj-nested-table__col-index">
                                                <label class="afmd-h88-cbx afmd-h88-cbx--all">
                                                    <input type="checkbox" class="afmd-h88-all-checkbox" aria-label="Select all lines">
                                                </label>
                                                Line
                                            </th>
                                            <th class="table__header proj-nested-table__col-name" data-pf1-field="line-name"></th>
                                            <th class="table__header proj-nested-table__col-text proj-nested-table__col-text--wrap" data-pf1-field="line-group">Line<br>Grouping</th>
                                            <th class="table__header proj-nested-table__col-desc" data-pf1-field="description">Description</th>
                                            <th class="table__header proj-nested-table__col-text" data-pf1-field="level">Level</th>
                                            <th class="table__header proj-nested-table__col-text proj-nested-table__col-text--wrap">Cond.<br>SOP</th>
                                            <th class="table__header proj-nested-table__col-text proj-nested-table__col-text--wrap" data-pf1-field="process-category">Process<br>Category</th>
                                            <th class="table__header proj-nested-table__col-uph proj-nested-table__col-text--wrap" data-pf1-field="target-uph">Target<br>UPH</th>
                                            <th class="table__header proj-nested-table__col-afmd">
                                                <div class="stat-col">
                                                    <span class="stat-col__label">AFMD Sync</span>
                                                    <button type="button" class="afmd-refresh-link" id="afmd-sync-btn">
                                                        <sf-symbol name="arrow.clockwise"></sf-symbol>
                                                        Refresh
                                                    </button>
                                                </div>
                                            </th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">PCNs</span><span class="stat-col__total" id="pf1-total-pcns" data-proj-tooltip="Total number of PCNs" data-proj-tooltip-placement="left">0</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">Station #</span><span class="stat-col__total" id="pf1-total-stations" data-proj-tooltip="Total number of stations" data-proj-tooltip-placement="left">15</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">Process #</span><span class="stat-col__total" id="pf1-total-processes" data-proj-tooltip="Total number of process" data-proj-tooltip-placement="left">22</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">HC #</span><span class="stat-col__total" id="pf1-total-hc" data-proj-tooltip="Total number of headcount" data-proj-tooltip-placement="left">90</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">Cons. #</span><span class="stat-col__total" id="pf1-total-cons" data-proj-tooltip="Total number of unique consumables" data-proj-tooltip-placement="left">0</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">Equip. #</span><span class="stat-col__total" id="pf1-total-eq" data-proj-tooltip="Total number of unique equipment and total number of equipment" data-proj-tooltip-placement="left">0 | 0</span></div></th>
                                        </tr>
                                    </thead>
                                    <tbody class="table__body afmd-actions-tbody afmd-actions-tbody--global" hidden>
                                        <tr class="table__row table__row--actions-bar">
                                            <td class="table__cell table__cell--actions-bar" colspan="99">
                                                <span class="equip-actions__count afmd-selected-count-global">0 stations selected:</span>
                                                <div class="afmd-global-actions">
                                                    <button class="btn btn--link btn--small afmd-global-action" data-action="copy">
                                                        <sf-symbol name="doc.on.doc"></sf-symbol>
                                                        Copy
                                                    </button>
                                                    <button class="btn btn--link btn--small afmd-global-action" data-action="paste">
                                                        <sf-symbol name="doc.on.clipboard"></sf-symbol>
                                                        Paste
                                                    </button>
                                                    <button class="btn btn--link btn--small afmd-global-action" data-action="cut">
                                                        <sf-symbol name="scissors"></sf-symbol>
                                                        Cut
                                                    </button>
                                                    <button class="btn btn--link btn--small afmd-global-action" data-action="duplicate">
                                                        <sf-symbol name="plus.square.on.square"></sf-symbol>
                                                        Duplicate
                                                    </button>
                                                    <button class="btn btn--link btn--small afmd-global-action" data-action="import">
                                                        <sf-symbol name="square.and.arrow.down"></sf-symbol>
                                                        Import
                                                    </button>
                                                    <button class="btn btn--link btn--small afmd-global-action" data-action="edit-field">
                                                        <sf-symbol name="pencil"></sf-symbol>
                                                        Edit field
                                                    </button>
                                                </div>
                                                <button class="btn btn--primary btn--small afmd-actions-sync-global">AFMD Sync</button>
                                            </td>
                                        </tr>
                                    </tbody>
                                    <tbody class="table__body" id="lines-table-body">
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        <!-- MP Build Event empty state — shown when MP is the active stage and no target Build Event has been assigned yet. -->
                        <div class="mp-empty-state">
                            <div class="empty-state">
                                <div class="empty-state__icon">
                                    <sf-symbol name="target"></sf-symbol>
                                </div>
                                <h3 class="empty-state__title">Select a target Build Event</h3>
                                <p class="empty-state__subtitle">MP mirrors a target Build Event in read-only mode, surfacing only items marked as Process of Record (POR).<br>This gives production a stable reference to the engineering-approved configuration.</p>
                                <div class="mp-empty-state__actions">
                                    <div class="equip-dropdown mp-target-control">
                                        <button type="button" class="equip-dropdown__trigger" aria-haspopup="listbox" aria-label="Build Event">
                                            <span class="equip-dropdown__value">Select Build Event...</span>
                                            <svg class="equip-dropdown__chevron" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                        </button>
                                        <ul class="equip-dropdown__menu"></ul>
                                    </div>
                                    <button class="btn btn--primary btn--medium mp-target-assign" disabled>Confirm</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tabs__panel" id="process-flow-2">
                        <!-- Toolbar with search and actions -->
                        <div class="process-toolbar">
                            <div class="process-toolbar__left">
                                <div class="pf-filter">
                                    <div class="pf-filter__row">
                                        <div class="pf-filter__field">
                                            <span class="pf-filter__icon" aria-hidden="true">
                                                <sf-symbol name="magnifyingglass"></sf-symbol>
                                            </span>
                                            <div class="pf-filter__chips" id="pf-filter-chips"></div>
                                            <input type="text" class="pf-filter__input" placeholder="Type keywords..." id="lines-search-2" autocomplete="off">
                                            <span class="pf-filter__shortcut" aria-hidden="true">⌘K</span>
                                            <button type="button" class="pf-filter__clear-all" aria-label="Clear all filters">
                                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 3.5L10.5 10.5M10.5 3.5L3.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                                            </button>
                                        </div>
                                        <button type="button" class="pf-filter__save-btn" aria-label="Save current filter as favorite" aria-pressed="false" hidden>
                                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.75L10.09 6.03L14.72 6.72L11.36 10.05L12.18 14.75L8 12.5L3.82 14.75L4.64 10.05L1.28 6.72L5.91 6.03L8 1.75Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                                        </button>
                                        <button type="button" class="pf-filter__options-btn" aria-label="Filter options" aria-haspopup="true" aria-expanded="false">
                                            <svg width="16" height="4" viewBox="0 0 16 4" fill="none"><circle cx="2" cy="2" r="1.6" fill="currentColor"/><circle cx="8" cy="2" r="1.6" fill="currentColor"/><circle cx="14" cy="2" r="1.6" fill="currentColor"/></svg>
                                        </button>
                                        <div class="pf-filter__options-pop" role="dialog" aria-label="Filter options" hidden></div>
                                        <span class="pf-filter__info-wrap">
                                            <span class="pf-filter__info" aria-label="Filter info" tabindex="0">
                                                <sf-symbol name="info.circle"></sf-symbol>
                                            </span>
                                        </span>
                                    </div>
                                    <div class="pf-filter__panel" role="dialog" aria-label="Filter options">
                                        <div class="pf-filter__panel-body" data-view="main"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="toolbar-actions">
                                <button class="tag-btn tag-btn--active js-toggle-station-info">
                                    <img src="../../davinci/assets/icons/regular/eye.svg" alt="" width="14" height="14">
                                    Station info
                                </button>

                                <button class="tag-btn tag-btn--active">
                                    <img src="../../davinci/assets/icons/regular/eye.svg" alt="" width="14" height="14">
                                    Process info
                                </button>

                                <button class="tag-btn">
                                    <img src="../../davinci/assets/icons/regular/eye.svg" alt="" width="14" height="14">
                                    50
                                </button>

                                <button class="toolbar-btn toolbar-btn--icon" aria-label="Settings">
                                    <img src="../../davinci/assets/icons/regular/gearshape.svg" alt="" width="16" height="16">
                                </button>
                            </div>
                        </div>

                        <section class="proj-nested-table">
                            <div class="table-container">
                                <table class="table table--lines table--lines-v2">
                                    <thead class="table__head">
                                        <tr class="table__row">
                                            <th class="table__header proj-nested-table__col-index">Line</th>
                                            <th class="table__header proj-nested-table__col-name"></th>
                                            <th class="table__header proj-nested-table__col-desc">Description</th>
                                            <th class="table__header proj-nested-table__col-text">Level</th>
                                            <th class="table__header proj-nested-table__col-text proj-nested-table__col-text--wrap">Cond.<br>SOP</th>
                                            <th class="table__header proj-nested-table__col-text proj-nested-table__col-text--wrap">Process<br>Category</th>
                                            <th class="table__header proj-nested-table__col-uph proj-nested-table__col-text--wrap">Target<br>UPH</th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">PCNs</span><span class="stat-col__total" id="pf2-total-pcns" data-proj-tooltip="Total number of PCNs" data-proj-tooltip-placement="left">1000</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">Station #</span><span class="stat-col__total" id="pf2-total-stations" data-proj-tooltip="Total number of stations" data-proj-tooltip-placement="left">10000</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">Process #</span><span class="stat-col__total" id="pf2-total-processes" data-proj-tooltip="Total number of process" data-proj-tooltip-placement="left">10000</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">HC #</span><span class="stat-col__total" id="pf2-total-hc" data-proj-tooltip="Total number of headcount" data-proj-tooltip-placement="left">10000</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">Cons. #</span><span class="stat-col__total" id="pf2-total-cons" data-proj-tooltip="Total number of unique consumables" data-proj-tooltip-placement="left">10000</span></div></th>
                                            <th class="table__header proj-nested-table__col-stat-num"><div class="stat-col"><span class="stat-col__label">Equip. #</span><span class="stat-col__total" id="pf2-total-eq" data-proj-tooltip="Total number of unique equipment and total number of equipment" data-proj-tooltip-placement="left">10000 | 1000</span></div></th>
                                        </tr>
                                    </thead>
                                    <tbody class="table__body afmd-actions-tbody afmd-actions-tbody--global" hidden>
                                        <tr class="table__row table__row--actions-bar">
                                            <td class="table__cell table__cell--actions-bar" colspan="99">

        <button class="btn btn--primary btn--medium" id="mp-edit-target-modal-confirm" disabled>Confirm</button>

    <!-- Duplicate Equipment modal body / footer -->
    <script id="duplicate-equipment-modal-body" type="text/html">
        <p class="dup-eq-modal__intro">The equipment below will be duplicated. Rename any item if needed.</p>
        <p class="dup-eq-modal__intro">If unchanged, the duplicated equipment will keep the original name with &ldquo;-copy&rdquo; added.</p>
        <div class="dup-eq-modal__fields" id="duplicate-equipment-fields-host"></div>
    </script>

    <script id="duplicate-equipment-modal-footer" type="text/html">
        <button class="btn btn--secondary btn--medium" id="duplicate-equipment-modal-cancel">Cancel</button>
        <button class="btn btn--primary btn--medium" id="duplicate-equipment-modal-confirm">Confirm</button>
    </script>

    <script id="duplicate-equipment-field-template" type="text/x-handlebars-template">
        {{#each items}}

    <!-- Publish wizard body / footer -->
    <script id="publish-wizard-body" type="text/html">
        <ol class="publish-wizard__stepper">
            <li class="publish-wizard__step is-active" data-step="1">
                <span class="publish-wizard__step-circle">1</span>
                <span class="publish-wizard__step-label">PCN</span>
            </li>
            <li class="publish-wizard__step" data-step="2">
                <span class="publish-wizard__step-circle">2</span>
                <span class="publish-wizard__step-label">Version Notes</span>
            </li>
            <li class="publish-wizard__step" data-step="3">
                <span class="publish-wizard__step-circle">3</span>
                <span class="publish-wizard__step-label">Publish</span>
            </li>
        </ol>

        <div class="publish-wizard__body">
            <!-- Step 1: PCN -->
            <div class="publish-wizard__panel is-active" data-panel="1">
                <p class="publish-wizard__text">Version 4 of the process flow for P1 - KAUANE - H10 has pending PCNs.</p>
                <p class="publish-wizard__text">If not resolved, pending PCNs will be moved to the next version. The process flow will be locked for editing, and all active users will be notified.</p>
            </div>

            <!-- Step 2: Version Notes -->
            <div class="publish-wizard__panel" data-panel="2">
                <p class="publish-wizard__text">Keep Version Notes in the new draft?</p>
                <div class="publish-wizard__options">
                    <label class="checkbox publish-wizard__checkbox">
                        <input type="checkbox" class="checkbox__input" id="keep-station-notes">
                        <span class="checkbox__box"></span>
                        <span class="publish-wizard__checkbox-label">Keep Station Version Notes</span>
                    </label>
                    <label class="checkbox publish-wizard__checkbox">
                        <input type="checkbox" class="checkbox__input" id="keep-equipment-notes">
                        <span class="checkbox__box"></span>
                        <span class="publish-wizard__checkbox-label">Keep Equipment Version Notes</span>
                    </label>
                </div>
                <div class="publish-wizard__warning">
                    <img src="../../davinci/assets/icons/regular/exclamationmark-triangle.svg" alt="" width="16" height="16" class="publish-wizard__warning-icon">
                    <span>Once published, this action can't be undone.</span>
                </div>
            </div>

            <!-- Step 3: Publish -->
            <div class="publish-wizard__panel" data-panel="3">
                <p class="publish-wizard__text">Ready to publish version 4 of the process flow.</p>
                <p class="publish-wizard__text">Click <strong>Publish</strong> to confirm and lock the current draft.</p>
            </div>
        </div>
    </script>
    <script id="publish-wizard-footer" type="text/html">
        <div class="publish-wizard__footer-left">
            <a href="#" class="publish-wizard__link" id="publish-wizard-verify">Verify list of pending PCNs</a>
            <button class="publish-wizard__back" id="publish-wizard-back" aria-label="Back" hidden>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <div class="publish-wizard__footer-right">
            <button class="btn btn--secondary btn--medium" id="publish-wizard-cancel">Cancel</button>
            <button class="btn btn--primary btn--medium" id="publish-wizard-next">Next</button>
        </div>
    </script>

    <!-- File upload modal body / footer -->
    <script id="file-upload-modal-body" type="text/html">
        <div class="file-upload-area" id="file-upload-area">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 8V32M24 8L16 16M24 8L32 16M8 32V36C8 37.0609 8.42143 38.0783 9.17157 38.8284C9.92172 39.5786 10.9391 40 12 40H36C37.0609 40 38.0783 39.5786 38.8284 38.8284C39.5786 38.0783 40 37.0609 40 36V32" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p style="margin: var(--space-m) 0 var(--space-xs) 0; color: var(--color-glyph-gray); font-size: var(--font-size-xxs); font-weight: var(--font-weight-medium);">
                Drag and drop your file here
            </p>
            <p style="margin: 0 0 var(--space-m) 0; color: var(--color-glyph-gray-secondary); font-size: var(--font-size-tiny);">
                or
            </p>
            <input type="file" id="file-input" style="display: none;" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg">
            <button class="btn btn--secondary btn--medium" id="browse-file-btn">Browse Files</button>
            <p style="margin: var(--space-m) 0 0 0; color: var(--color-glyph-gray-tertiary); font-size: var(--font-size-tiny);">
                Supported formats: PDF, DOC, DOCX, XLS, XLSX, PNG, JPG
            </p>
        </div>
        <div id="file-selected-info" style="display: none; margin-top: var(--space-m); padding: var(--space-m); background-color: var(--color-fill-tertiary); border-radius: var(--space-xs);">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: var(--space-s);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V9L13 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13 2V9H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div>
                        <p id="file-name" style="margin: 0; color: var(--color-glyph-gray); font-size: var(--font-size-xxs); font-weight: var(--font-weight-medium);"></p>
                        <p id="file-size" style="margin: 0; color: var(--color-glyph-gray-secondary); font-size: var(--font-size-tiny);"></p>
                    </div>
                </div>
                <button class="btn btn--link btn--small" id="remove-file-btn">Remove</button>
            </div>
        </div>
    </script>
    <script id="file-upload-modal-footer" type="text/html">
        <button class="btn btn--secondary btn--medium" id="cancel-upload-btn">Cancel</button>
        <button class="btn btn--primary btn--medium" id="upload-file-btn" disabled>Upload</button>
    </script>

    <script id="pf-filter-info-template" type="text/html">
        <div class="pf-filter__info-popover" role="tooltip">
            <h4 class="pf-filter__info-title">Search and Filter</h4>
            <p class="pf-filter__info-lead">The search can be started either by typing the column name (e.g., "ENG Intent") or by the selection (e.g., "POR").</p>
            <h5 class="pf-filter__info-subhead">Keyboard shortcuts</h5>
            <section class="pf-filter__info-section">
                <h6>Open filter</h6>
                <p><kbd>⌘</kbd> / <kbd>K</kbd> : Focus on the filter bar.</p>
            </section>
            <section class="pf-filter__info-section">
                <h6>Navigate Categories</h6>
                <p><kbd>↑</kbd> / <kbd>↓</kbd> : Move through filter groups (Lines, Stations, etc.).</p>
            </section>
            <section class="pf-filter__info-section">
                <h6>Navigate Tags</h6>
                <p><kbd>←</kbd> / <kbd>→</kbd> : Switch between tags.</p>
                <p><kbd>Return</kbd> : Open tag actions.</p>
            </section>
            <section class="pf-filter__info-section">
                <h6>Tag Actions</h6>
                <p><kbd>↑</kbd> / <kbd>↓</kbd> : Browse actions.</p>
                <p><kbd>Return</kbd> : Select action.</p>
            </section>
            <section class="pf-filter__info-section">
                <h6>Search by DRI</h6>
                <p>Type <kbd>@</kbd> + <strong>user name</strong> : Search directly by the DRI's name, then choose a DRI type.</p>
                <p>Type <strong>DRI department</strong> : Start by typing the DRI type, then add the person's name.</p>
            </section>
        </div>
    </script>
